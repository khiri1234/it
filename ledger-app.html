<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Ledger — IT Business Suite</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F8;
    --surface:#FFFFFF;
    --ink:#152033;
    --ink-soft:#5B6B82;
    --line:#E3E8EE;
    --navy:#152A4D;
    --navy-2:#1F3A63;
    --teal:#0E9C90;
    --teal-soft:#E3F5F3;
    --amber:#C77F16;
    --amber-soft:#FBF0DD;
    --red:#C4383D;
    --red-soft:#FBE7E7;
    --green:#2E8B4F;
    --green-soft:#E7F5EC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px;}
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--navy);
    color:#fff;
    padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex;align-items:center;gap:10px;
  }
  .topbar .back{
    width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;border:none;color:#fff;
  }
  .topbar .title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .topbar .sub{font-size:11px;color:rgba(255,255,255,.55);font-family:'IBM Plex Mono',monospace;margin-top:1px;}
  .content{padding:14px 14px 8px;}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
  }
  .stripe{
    border-left:4px solid var(--line);
    padding-left:12px;
  }
  .stripe.paid,.stripe.received,.stripe.accepted{border-left-color:var(--green);}
  .stripe.sent,.stripe.draft{border-left-color:var(--ink-soft);}
  .stripe.overdue{border-left-color:var(--red);}
  .stripe.pending{border-left-color:var(--amber);}
  .stripe.partial{border-left-color:var(--amber);}
  .stripe.planning{border-left-color:var(--ink-soft);}
  .stripe.active{border-left-color:var(--teal);}
  .stripe.completed{border-left-color:var(--green);}
  .stripe.on-hold{border-left-color:var(--amber);}
  .badge{
    display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
    font-family:'IBM Plex Mono',monospace;
  }
  .badge.paid,.badge.received,.badge.accepted{background:var(--green-soft);color:var(--green);}
  .badge.sent{background:var(--teal-soft);color:var(--teal);}
  .badge.draft{background:#EEF1F5;color:var(--ink-soft);}
  .badge.overdue{background:var(--red-soft);color:var(--red);}
  .badge.pending{background:var(--amber-soft);color:var(--amber);}
  .badge.partial{background:var(--amber-soft);color:var(--amber);}
  .badge.converted{background:#EEF1F5;color:var(--ink-soft);}
  .badge.planning{background:#EEF1F5;color:var(--ink-soft);}
  .badge.active{background:var(--teal-soft);color:var(--teal);}
  .badge.completed{background:var(--green-soft);color:var(--green);}
  .badge.on-hold{background:var(--amber-soft);color:var(--amber);}
  .row-between{display:flex;align-items:center;justify-content:space-between;}
  .muted{color:var(--ink-soft);}
  .small{font-size:12.5px;}
  .tiny{font-size:11px;}
  .btn{
    border:none;border-radius:11px;padding:12px 16px;font-weight:600;font-size:14.5px;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-ghost{background:var(--surface);color:var(--navy);border:1px solid var(--line);}
  .btn-danger{background:var(--red-soft);color:var(--red);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px;font-size:13px;border-radius:9px;}
  input,select,textarea{
    width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:10px 11px;font-size:14.5px;color:var(--ink);font-family:'IBM Plex Sans',sans-serif;
    outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--navy-2);}
  label{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:5px;margin-top:12px;}
  label:first-child{margin-top:0;}
  .field{margin-bottom:2px;}
  .item-row{
    border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#FAFBFC;
  }
  .item-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .totals{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px;}
  .totals .line{display:flex;justify-content:space-between;padding:3px 0;font-size:14px;}
  .totals .line.grand{font-weight:700;font-size:17px;font-family:'Space Grotesk',sans-serif;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;}
  .tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
    background:var(--surface);border-top:1px solid var(--line);
    display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
    z-index:30;
  }
  .tabbtn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
    background:none;border:none;color:var(--ink-soft);font-size:10.5px;font-weight:600;
    cursor:pointer;font-family:'IBM Plex Sans',sans-serif;
  }
  .tabbtn.active{color:var(--navy);}
  .tabbtn svg{width:20px;height:20px;}
  .fab{
    position:fixed;bottom:78px;left:50%;transform:translateX(calc(-50% + 200px));
    width:52px;height:52px;border-radius:16px;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;
    box-shadow:0 8px 20px rgba(14,156,144,.35);z-index:25;
  }
  @media (max-width:520px){.fab{transform:translateX(calc(-50vw + 200px));left:50vw;}}
  .empty{text-align:center;padding:40px 16px;color:var(--ink-soft);}
  .empty svg{width:40px;height:40px;margin-bottom:10px;opacity:.5;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;}
  .stat .num{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;}
  .stat .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);}
  .toggle-row:last-child{border-bottom:none;}
  .switch{position:relative;width:42px;height:24px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#D7DDE5;border-radius:24px;cursor:pointer;transition:.15s;}
  .slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  input:checked + .slider{background:var(--teal);}
  input:checked + .slider:before{transform:translateX(18px);}
  .bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .bar-track{flex:1;height:9px;background:#EEF1F5;border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--teal);border-radius:6px;}
  .section-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;margin:18px 0 10px;color:var(--ink);}
  .section-title:first-child{margin-top:0;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.5);z-index:40;display:flex;align-items:flex-end;}
  .modal-sheet{background:var(--surface);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;}
  .modal-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 12px;}
  .segmented{display:flex;background:#EEF1F5;border-radius:10px;padding:3px;gap:3px;}
  .segmented button{flex:1;border:none;background:none;padding:8px 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:'IBM Plex Sans',sans-serif;}
  .segmented button.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .chip-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .chip{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  ::-webkit-scrollbar{display:none;}
  .low-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:5px;}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:500;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.25);}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- ICONS ---------- */

  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',

const ic=(n,cls='')=>`<span class="${cls}" style="display:inline-flex;width:18px;height:18px">${ICO[n]||''}</span>`;

/* ---------- STORAGE ---------- */
const KEYS=['settings','invoices','quotes','purchases','inventory','users','projects'];
const DEFAULT_SETTINGS={
  companyName:'The H IT Solutions', companyPhone:'', companyEmail:'', companyAddress:'',
  currency:'AED', vatRate:5, vatDefaultOn:true,
  invoicePrefix:'INV', quotePrefix:'QT', poPrefix:'PO', projectPrefix:'PRJ',
  invoiceNext:1, quoteNext:1, poNext:1, projectNext:1
};
let S = { settings:{...DEFAULT_SETTINGS}, invoices:[], quotes:[], purchases:[], inventory:[], users:[], projects:[] };
let VIEW = {name:'dashboard', params:{}};
let SALES_TAB='invoices', STOCK_TAB='inventory';
let STACK=[]; // for back navigation
let CURRENT_USER=null; // {id,name,username,role} — session only, not persisted
let AUTH_ERR='';

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isAdmin(){ return CURRENT_USER && CURRENT_USER.role==='admin'; }

/* ---------- FIREBASE (optional — paste your project's config below) ----------
   1. console.firebase.google.com → Create project (free "Spark" plan is enough)
   2. Build → Firestore Database → Create database → Start in "production mode" → pick a region
   3. Build → Authentication → Get started → Sign-in method → enable "Anonymous"
   4. Project settings (gear icon) → General → "Your apps" → Add app → Web (</>) → register it
   5. Copy the firebaseConfig object it shows you and paste it below, replacing the null.
   6. In Firestore → Rules, paste:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /ledger/{doc} { allow read, write: if request.auth != null; }
          }
        }
      then click Publish.
   Leave this as null to keep using the built-in storage (polling every 6s) instead. */
const FIREBASE_CONFIG = null;
/* Example:
const const FIREBASE_CONFIG = null;' with 'const FIREBASE_CONFIG = { ...your copied object... }; = {
  apiKey: "AIzaSy...", authDomain: "your-app.firebaseapp.com", projectId: "your-app",
  storageBucket: "your-app.appspot.com", messagingSenderId: "123456789", appId: "1:123:web:abcd"
};
*/
let FIREBASE_ENABLED=false, fbDB=null, fbAuth=null;

let STORAGE_MODE='builtin'; // 'firebase' | 'builtin' | 'none'
async function loadAll(){
  if(FIREBASE_CONFIG){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      fbDB = firebase.firestore();
      fbAuth = firebase.auth();
      await new Promise((resolve)=>{
        const timeout=setTimeout(resolve,5000);
        fbAuth.onAuthStateChanged(user=>{ if(user){ clearTimeout(timeout); resolve(); } });
        fbAuth.signInAnonymously().catch(e=>{ console.error('Firebase auth failed',e); clearTimeout(timeout); resolve(); });
      });
      if(fbAuth.currentUser){ FIREBASE_ENABLED=true; STORAGE_MODE='firebase'; }
    }catch(e){ console.error('Firebase init failed — falling back to built-in storage',e); }
  }

  if(FIREBASE_ENABLED){
    for(const k of KEYS){
      try{
        const snap = await fbDB.collection('ledger').doc(k).get();
        if(snap.exists && snap.data().json) S[k]=JSON.parse(snap.data().json);
      }catch(e){ console.error('firestore read failed',k,e); }
    }
  } else if(typeof window.storage === 'undefined' || !window.storage){
    // No Claude storage bridge available (e.g. opened as a plain downloaded file, or outside claude.ai)
    STORAGE_MODE='none';
  } else {
    for(const k of KEYS){
      try{
        const r = await window.storage.get(k,true);
        if(r && r.value) S[k] = JSON.parse(r.value);
      }catch(e){ /* not found yet, keep default */ }
    }
  }
  if(!S.settings || !S.settings.companyName) S.settings = {...DEFAULT_SETTINGS, ...(S.settings||{})};
  render();

  if(FIREBASE_ENABLED){ attachFirestoreListeners(); }
  else if(STORAGE_MODE!=='none'){ startSync(); }
}
const FORM_VIEWS=['invoice-form','quote-form','item-form','purchase-form','settings-form','team-form','bulk-payment','project-form'];

/* Realtime path (Firebase) */
function attachFirestoreListeners(){
  KEYS.forEach(k=>{
    fbDB.collection('ledger').doc(k).onSnapshot(snap=>{
      if(!snap.exists) return;
      const json = snap.data().json;
      if(json===undefined) return;
      const current = JSON.stringify(S[k]);
      if(json!==current){
        S[k]=JSON.parse(json);
        if(!FORM_VIEWS.includes(VIEW.name) && CURRENT_USER){ render(); flashSync(); }
      }
    }, err=>console.error('firestore listener error',k,err));
  });
}

/* Polling fallback path (built-in storage) */
let syncTimer=null, syncing=false;
function startSync(){
  if(syncTimer) return;
  syncTimer = setInterval(syncPull, 6000);
}
async function syncPull(){
  if(STORAGE_MODE==='none' || syncing || FORM_VIEWS.includes(VIEW.name)) return;
  syncing = true;
  const onAuthScreen = !CURRENT_USER; // setup or login — never yank the form out from under typing
  try{
    let changed=false;
    for(const k of KEYS){
      const r = await window.storage.get(k,true);
      const incoming = r && r.value ? r.value : null;
      const current = JSON.stringify(S[k]);
      if(incoming!==null && incoming!==current){ S[k]=JSON.parse(incoming); changed=true; }
    }
    if(changed && !onAuthScreen){ render(); flashSync(); }
  }catch(e){ /* offline or transient — ignore */ }
  syncing = false;
}
function flashSync(){
  const el=document.getElementById('syncDot');
  if(el){ el.style.opacity='1'; setTimeout(()=>{ if(el) el.style.opacity='0'; },1200); }
}
let storageWarned=false;
async function persist(key){
  const payload = JSON.stringify(S[key]);
  if(FIREBASE_ENABLED){
    try{ await fbDB.collection('ledger').doc(key).set({json:payload, updatedAt: Date.now()}); return; }
    catch(e){ console.error('firestore save failed',key,e); toast('Save failed — check connection'); return; }
  }
  if(STORAGE_MODE==='none'){
    if(!storageWarned){ storageWarned=true; toast('Not saved — open this from the Claude conversation, or set up Firebase (More → Sync)'); }
    return; // keep working in-memory for this session even though nothing persists
  }
  try{
    await window.storage.set(key, payload, true);
  }catch(e){
    console.error('storage.set failed, retrying without shared flag',key,e);
    try{
      await window.storage.set(key, payload, false);
      if(!storageWarned){ storageWarned=true; toast('Saved locally only — live sync unavailable right now'); }
    }catch(e2){
      console.error('save failed',key,e2);
      toast('Save failed — check connection, or set up Firebase (More → Sync)');
    }
  }
}

/* ---------- UTIL ---------- */
const uid=()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=> new Date().toISOString().slice(0,10);
function fmtMoney(n){ n = Number(n)||0; return S.settings.currency+' '+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastTimer=null;
function toast(msg){
  clearTimeout(toastTimer);
  let el = document.getElementById('toastEl');
  if(!el){ el=document.createElement('div'); el.id='toastEl'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display='block';
  toastTimer = setTimeout(()=>{ el.style.display='none'; },2200);
}

function nextNumber(type){
  const s=S.settings;
  if(type==='invoice'){ const n=s.invoiceNext||1; s.invoiceNext=n+1; return `${s.invoicePrefix}-${new Date().getFullYear()}-${String(n).padStart(4,'0')}`; }
  if(type==='quote'){ const n=s.quoteNext||1; s.quoteNext=n+1; return `${s.quotePrefix}-${new Date().getFullYear()}-${String(n).padStart(4,'0')}`; }
  if(type==='purchase'){ const n=s.poNext||1; s.poNext=n+1; return `${s.poPrefix}-${new Date().getFullYear()}-${String(n).padStart(4,'0')}`; }
  if(type==='project'){ const n=s.projectNext||1; s.projectNext=n+1; return `${s.projectPrefix}-${new Date().getFullYear()}-${String(n).padStart(4,'0')}`; }
}

function calcItems(items){
  return items.map(it=>{
    const qty=Number(it.qty)||0, price=Number(it.price)||0, disc=Number(it.discountPct)||0;
    const gross = qty*price;
    const discAmt = gross*(disc/100);
    return {...it, gross, discAmt, net: gross-discAmt};
  });
}
function calcTotals(items, vatOn, vatRate, overallDiscPct){
  const calced = calcItems(items);
  const subtotal = calced.reduce((a,b)=>a+b.net,0);
  const overallDiscAmt = subtotal*((Number(overallDiscPct)||0)/100);
  const afterDisc = subtotal - overallDiscAmt;
  const vatAmt = vatOn ? afterDisc*((Number(vatRate)||0)/100) : 0;
  const total = afterDisc+vatAmt;
  return {calced, subtotal, overallDiscAmt, afterDisc, vatAmt, total};
}

/* ---------- PAYMENTS ---------- */
const PAY_METHODS=['Cash','Card','Bank transfer','Cheque','Other'];
function docTotal(d){ return calcTotals(d.items,d.vatOn,d.vatRate,d.discountPct).total; }
function paymentsSum(d){ return (d.payments||[]).reduce((a,p)=>a+(Number(p.amount)||0),0); }
function remaining(d){ return Math.max(0, docTotal(d) - paymentsSum(d)); }
function refreshPaymentStatus(d){
  const total=docTotal(d), paid=paymentsSum(d);
  if(total>0 && paid>=total-0.005) d.status='paid';
  else if(paid>0) d.status='partial';
  else if(d.status==='paid'||d.status==='partial') d.status='sent';
}

/* ---------- PROJECTS ---------- */
function boqLineTotal(item){ return (Number(item.qty)||0)*(Number(item.unitPrice)||0); }
function projectValue(p){ return (p.boq||[]).reduce((a,b)=>a+boqLineTotal(b),0); }
function projectAdvances(p){ return (p.payments||[]).reduce((a,pay)=>a+(Number(pay.amount)||0),0); }
function projectBalance(p){ return Math.max(0, projectValue(p)-projectAdvances(p)); }
function boqProgressPct(p, field){
  const totalQty = (p.boq||[]).reduce((a,b)=>a+(Number(b.qty)||0),0);
  if(totalQty<=0) return 0;
  const doneQty = (p.boq||[]).reduce((a,b)=>a+Math.min(Number(b[field])||0, Number(b.qty)||0),0);
  return Math.min(100, doneQty/totalQty*100);
}
function ensureModalRoot(){
  let m=document.getElementById('modalRoot');
  if(!m){ m=document.createElement('div'); m.id='modalRoot'; document.body.appendChild(m); }
  return m;
}
function closeModal(){ const m=document.getElementById('modalRoot'); if(m) m.innerHTML=''; }
function payKindStore(kind){ return kind==='project'? S.projects : S.invoices; }
function payKindKey(kind){ return kind==='project'? 'projects' : 'invoices'; }
function payKindRemaining(kind,d){ return kind==='project'? projectBalance(d) : remaining(d); }

function showPaymentModal(kind, id){
  const d=payKindStore(kind).find(x=>x.id===id); if(!d) return;
  const rem=payKindRemaining(kind,d);
  const names=[...new Set(S.users.map(u=>u.name))];
  PAYMENT_ROWS=[{amount: rem>0?rem.toFixed(2):'', date:todayISO(), method:PAY_METHODS[0], paidTo:CURRENT_USER.name, note:''}];
  ensureModalRoot().innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div style="font-family:'Space Grotesk';font-weight:700;font-size:16px;margin-bottom:2px">Record ${kind==='project'?'advance ':''}payment(s)</div>
      <div class="tiny muted" style="margin-bottom:10px">Remaining: <span class="mono">${fmtMoney(rem)}</span></div>
      <datalist id="teamNames">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <div id="paymentRowsWrap">${PAYMENT_ROWS.map((r,i)=>paymentRowHtml(i,r)).join('')}</div>
      <button class="btn btn-ghost btn-block" onclick="addPaymentRow()">${ic('plus')} Add another payment</button>
      <div class="totals" id="paymentRowsTotals"></div>
      <div style="display:flex;gap:10px;margin-top:12px">

        <button class="btn btn-primary btn-block" onclick="savePayments('${kind}','${id}')">${ic('check')} Save payment(s)</button>
      </div>
    </div>
  </div>`;
  updatePaymentRowsTotals();
}
function addPaymentRow(){
  PAYMENT_ROWS = readPaymentRowsFromDOM();
  PAYMENT_ROWS.push({amount:'', date:todayISO(), method:PAY_METHODS[0], paidTo:CURRENT_USER.name, note:''});
  document.getElementById('paymentRowsWrap').innerHTML = PAYMENT_ROWS.map((r,i)=>paymentRowHtml(i,r)).join('');
  updatePaymentRowsTotals();
}
function removePaymentRow(idx){
  PAYMENT_ROWS = readPaymentRowsFromDOM();
  PAYMENT_ROWS.splice(idx,1);
  if(PAYMENT_ROWS.length===0) PAYMENT_ROWS.push({amount:'', date:todayISO(), method:PAY_METHODS[0], paidTo:CURRENT_USER.name, note:''});
  document.getElementById('paymentRowsWrap').innerHTML = PAYMENT_ROWS.map((r,i)=>paymentRowHtml(i,r)).join('');
  updatePaymentRowsTotals();
}
function updatePaymentRowsTotals(){
  const box=document.getElementById('paymentRowsTotals'); if(!box) return;
  const rows=readPaymentRowsFromDOM();
  const total=rows.reduce((a,r)=>a+(Number(r.amount)||0),0);
  box.innerHTML=`<div class="line grand"><span>Total this batch</span><span class="mono">${fmtMoney(total)}</span></div>`;
}
function savePayments(kind, id){
  const d=payKindStore(kind).find(x=>x.id===id); if(!d) return;
  const rows=readPaymentRowsFromDOM().filter(r=>Number(r.amount)>0);
  if(rows.length===0){ toast('Enter at least one payment amount'); return; }
  if(!d.payments) d.payments=[];
  rows.forEach(r=>{
    d.payments.push({
      id:uid(), amount:Number(r.amount), date:r.date||todayISO(), method:r.method,
      paidTo:r.paidTo.trim()||CURRENT_USER.name, note:r.note.trim(), recordedBy:CURRENT_USER.name
    });
  });
  if(kind==='invoice') refreshPaymentStatus(d);
  persist(payKindKey(kind));
  closeModal();
  toast(rows.length>1? `${rows.length} payments recorded` : 'Payment recorded');
  render();
}
function removePayment(kind, id, payId){
  if(!isAdmin()){ toast('Only admins can remove payments'); return; }
  if(!confirm('Remove this payment record?')) return;
  const d=payKindStore(kind).find(x=>x.id===id); if(!d) return;
  d.payments=(d.payments||[]).filter(p=>p.id!==payId);
  if(kind==='invoice') refreshPaymentStatus(d);
  persist(payKindKey(kind));
  render();
}

function renderBulkInvoiceRows(){
  const customer = document.getElementById('bp_customer').value;
  const wrap = document.getElementById('bulkInvoicesWrap');
  const metaBox = document.getElementById('bulkPaymentMeta');
  if(!customer){ wrap.innerHTML=''; metaBox.style.display='none'; return; }
  const invs = S.invoices.filter(i=>i.customer===customer && remaining(i)>0).sort((a,b)=>a.date.localeCompare(b.date));
  wrap.innerHTML = `<div class="section-title">Open invoices for ${esc(customer)}</div>` + invs.map(i=>`
    <div class="item-row" data-invid="${i.id}">
      <div class="row-between"><div class="small" style="font-weight:600">${i.number}</div><div class="tiny muted">${fmtDate(i.date)}</div></div>
      <div class="tiny muted" style="margin-bottom:6px">Remaining: <span class="mono">${fmtMoney(remaining(i))}</span></div>
      <input type="number" min="0" step="0.01" class="bulkAmt" placeholder="Amount to apply to this invoice" oninput="updateBulkTotals()">
    </div>`).join('');
  metaBox.style.display='block';
  updateBulkTotals();
}
function autoSplitBulk(){
  const total = Number(document.getElementById('bp_total').value)||0;
  let left = total;
  document.querySelectorAll('.item-row[data-invid]').forEach(row=>{
    const inv = S.invoices.find(x=>x.id===row.dataset.invid);
    const rem = inv? remaining(inv) : 0;
    const alloc = Math.min(rem, Math.max(0,left));
    row.querySelector('.bulkAmt').value = alloc>0 ? alloc.toFixed(2) : '';
    left -= alloc;
  });
  updateBulkTotals();
}
function updateBulkTotals(){
  const box=document.getElementById('bulkTotalsBox');
  if(!box) return;
  const rows=[...document.querySelectorAll('.item-row[data-invid]')];
  const allocated = rows.reduce((a,r)=>a+(Number(r.querySelector('.bulkAmt').value)||0),0);
  const total = Number(document.getElementById('bp_total')?.value)||0;
  const diff = total-allocated;
  box.innerHTML=`
    <div class="line"><span class="muted">Allocated to invoices</span><span class="mono">${fmtMoney(allocated)}</span></div>
    <div class="line grand"><span>${diff<0?'Over-allocated by':'Unallocated'}</span><span class="mono" style="color:${diff<0?'var(--red)':'inherit'}">${fmtMoney(Math.abs(diff))}</span></div>`;
}
function saveBulkPayment(){
  const customer = document.getElementById('bp_customer')?.value;
  if(!customer){ toast('Select a customer'); return; }
  const date=document.getElementById('bp_date').value||todayISO();
  const method=document.getElementById('bp_method').value;
  const paidTo=document.getElementById('bp_to').value.trim()||CURRENT_USER.name;
  const note=document.getElementById('bp_note').value.trim();
  const rows=[...document.querySelectorAll('.item-row[data-invid]')];
  let count=0;
  rows.forEach(row=>{
    const amt = Number(row.querySelector('.bulkAmt').value)||0;
    if(amt<=0) return;
    const inv = S.invoices.find(x=>x.id===row.dataset.invid);
    if(!inv) return;
    if(!inv.payments) inv.payments=[];
    inv.payments.push({id:uid(), amount:amt, date, method, paidTo, note, recordedBy:CURRENT_USER.name});
    refreshPaymentStatus(inv);
    count++;
  });
  if(count===0){ toast('Enter at least one allocation amount'); return; }
  persist('invoices');
  toast(`Payment applied to ${count} invoice${count>1?'s':''}`);
  goBack();
}

function findInventoryByName(name){
  return S.inventory.find(i=>i.name.toLowerCase()===String(name||'').toLowerCase());
}
function adjustStock(id, delta){
  const it = S.inventory.find(i=>i.id===id);
  if(it){ it.stock = Math.max(0,(Number(it.stock)||0)+delta); }
}

async function doSetupAdmin(){
  const name=document.getElementById('su_name').value.trim();
  const username=document.getElementById('su_user').value.trim().toLowerCase();
  const pin=document.getElementById('su_pin').value;
  if(!name||!username||pin.length<4){ AUTH_ERR='Fill in all fields — PIN needs 4+ characters.'; render(); return; }
  const passHash = await sha256(username+':'+pin);
  const user={id:uid(), name, username, passHash, role:'admin'};
  S.users.push(user);
  await persist('users');
  CURRENT_USER={id:user.id,name:user.name,username:user.username,role:user.role};
  AUTH_ERR='';
  toast('Welcome, '+name+'!');
  render();
}
function renderLogin(){
  return `
  <div class="content" style="padding-top:60px">
    <div style="text-align:center;margin-bottom:22px">
      <div class="display" style="font-size:22px;font-weight:700">${esc(S.settings.companyName||'Ledger')}</div>
      <div class="tiny muted">Sign in to continue</div>
    </div>
    <div class="card">
      <label>Username</label><input id="li_user" placeholder="Username" autocapitalize="off">
      <label>PIN / passcode</label><input id="li_pin" type="password" placeholder="••••">
      <div id="li_err" class="tiny" style="color:var(--red);min-height:16px;margin-top:6px">${esc(AUTH_ERR)}</div>
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">${ic('check')} Sign in</button>
  </div>`;
}
async function doLogin(){
  const username=document.getElementById('li_user').value.trim().toLowerCase();
  const pin=document.getElementById('li_pin').value;
  const passHash = await sha256(username+':'+pin);
  const user = S.users.find(u=>u.username===username && u.passHash===passHash);
  if(!user){ AUTH_ERR='Incorrect username or PIN.'; render(); return; }
  CURRENT_USER={id:user.id,name:user.name,username:user.username,role:user.role};
  AUTH_ERR='';
  render();
}
function logout(){ CURRENT_USER=null; go('dashboard'); }

function goBack(){ if(STACK.length){ const v=STACK.pop(); VIEW=v; render(); } else { go('dashboard'); } }
function goPush(name, params={}){ STACK.push(VIEW); go(name, params); }

/* ---------- RENDER ROOT ---------- */
function noStorageBanner(){
  if(STORAGE_MODE!=='none') return '';
  return `<div style="background:var(--amber-soft);color:var(--amber);padding:10px 14px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px">
    ${ic('alert')} Nothing will be saved — open this from the Claude conversation, or set up Firebase for standalone hosting.
  </div>`;
}
function render(){
  const app = document.getElementById('app');
  if(!S.users || S.users.length===0){ app.innerHTML = noStorageBanner() + renderSetup(); return; }
  if(!CURRENT_USER){ app.innerHTML = noStorageBanner() + renderLogin(); return; }
  // staff can't reach admin-only views directly
  if(!isAdmin() && ['settings-form'].includes(VIEW.name)){ VIEW={name:'more',params:{}}; }
  let body='';
  switch(VIEW.name){
    case 'dashboard': body = renderDashboard(); break;
    case 'sales': body = renderSalesList(); break;
    case 'invoice-form': body = renderDocForm('invoice', VIEW.params.id); break;
    case 'quote-form': body = renderDocForm('quote', VIEW.params.id); break;
    case 'invoice-view': body = renderDocView('invoice', VIEW.params.id); break;
    case 'quote-view': body = renderDocView('quote', VIEW.params.id); break;
    case 'stock': body = renderStockList(); break;
    case 'item-form': body = renderItemForm(VIEW.params.id); break;
    case 'purchase-form': body = renderPurchaseForm(VIEW.params.id); break;
    case 'purchase-view': body = renderPurchaseView(VIEW.params.id); break;
    case 'bulk-payment': body = renderBulkPayment(); break;
    case 'projects': body = renderProjectsList(); break;
    case 'project-form': body = renderProjectForm(VIEW.params.id); break;
    case 'project-view': body = renderProjectView(VIEW.params.id); break;
    case 'reports': body = renderReports(); break;
    case 'more': body = renderMore(); break;
    case 'settings-form': body = renderSettingsForm(); break;
    case 'team-form': body = renderTeamForm(); break;
    default: body = renderDashboard();
  }
  app.innerHTML = noStorageBanner() + body + renderTabbar();
  afterRender();
}

  const outstanding = inv.reduce((a,b)=>a+remaining(b),0);
  const now = new Date(); const thisMonth = now.toISOString().slice(0,7);
  const paidThisMonth = inv.reduce((a,b)=> a + (b.payments||[]).filter(p=>(p.date||'').slice(0,7)===thisMonth).reduce((x,p)=>x+(Number(p.amount)||0),0), 0);
  const lowStock = S.inventory.filter(i=> Number(i.stock) <= Number(i.lowStockThreshold||0));
  const draftQuotes = S.quotes.filter(q=>q.status!=='converted').length;

  const recent = [
    ...inv.map(d=>({...d,kind:'invoice'})),
    ...S.quotes.map(d=>({...d,kind:'quote'})),
    ...S.purchases.map(d=>({...d,kind:'purchase'}))
  ].sort((a,b)=> (b.date||'').localeCompare(a.date||'')).slice(0,6);

  return `
  ${topbar(S.settings.companyName||'Dashboard', 'Overview')}
  <div class="content">

function renderItemRows(items){
  return items.map((it,idx)=>`
    <div class="item-row" data-idx="${idx}">

        <div><label style="margin-top:8px">Qty</label><input type="number" min="0" step="1" value="${it.qty}" oninput="liveTotals()" class="rowQty"></div>
        <div><label style="margin-top:8px">Unit price</label><input type="number" min="0" step="0.01" value="${it.price}" oninput="liveTotals()" class="rowPrice"></div>
      </div>

        <div><label style="margin-top:8px">Discount %</label><input type="number" min="0" max="100" step="1" value="${it.discountPct||0}" oninput="liveTotals()" class="rowDiscount"></div>

    `<datalist id="invDatalist">${S.inventory.map(i=>`<option value="${esc(i.name)}">`).join('')}</datalist>`;

function readItemsFromDOM(){
  const rows=[...document.querySelectorAll('.item-row')];
  return rows.map(r=>{
    const desc=r.querySelector('.rowDesc').value.trim();
    const match=findInventoryByName(desc);
    return {
      desc, qty:Number(r.querySelector('.rowQty').value)||0,
      price:Number(r.querySelector('.rowPrice').value)||0,
      discountPct:Number(r.querySelector('.rowDiscount').value)||0,
      invId: match?match.id:null
    };
  }).filter(r=>r.desc || r.qty || r.price);
}
function onItemDescChange(idx,val){
  const match=findInventoryByName(val);
  if(match){
    const rows=[...document.querySelectorAll('.item-row')];
    const r=rows[idx];
    if(r){ r.querySelector('.rowPrice').value = match.sellPrice; }
  }
  liveTotals();
}
let currentDraftItems=null;
function addItemRow(){
  currentDraftItems = readItemsFromDOM();
  currentDraftItems.push({desc:'',qty:1,price:0,discountPct:0,invId:null});
  document.getElementById('itemsWrap').innerHTML = renderItemRows(currentDraftItems);
  liveTotals();
}
function removeItemRow(idx){
  currentDraftItems = readItemsFromDOM();
  currentDraftItems.splice(idx,1);
  if(currentDraftItems.length===0) currentDraftItems.push({desc:'',qty:1,price:0,discountPct:0,invId:null});
  document.getElementById('itemsWrap').innerHTML = renderItemRows(currentDraftItems);
  liveTotals();
}
function liveTotals(){
  const box=document.getElementById('totalsBox');
  if(!box) return;
  const items=readItemsFromDOM();
  const vatOn=document.getElementById('f_vat')?.checked;
  const discountPct=Number(document.getElementById('f_disc')?.value)||0;
  const t=calcTotals(items,vatOn,S.settings.vatRate,discountPct);
  box.innerHTML=`
    <div class="line"><span class="muted">Subtotal</span><span class="mono">${fmtMoney(t.subtotal)}</span></div>
    ${t.overallDiscAmt?`<div class="line"><span class="muted">Discount</span><span class="mono">-${fmtMoney(t.overallDiscAmt)}</span></div>`:''}
    ${vatOn?`<div class="line"><span class="muted">VAT (${S.settings.vatRate}%)</span><span class="mono">${fmtMoney(t.vatAmt)}</span></div>`:''}
    <div class="line grand"><span>Total</span><span class="mono">${fmtMoney(t.total)}</span></div>`;
}

function saveDoc(type,id){
  const list = type==='invoice'? S.invoices : S.quotes;
  const customer = document.getElementById('f_customer').value.trim();
  if(!customer){ toast('Please enter a customer name'); return; }
  const items = readItemsFromDOM();
  if(items.length===0){ toast('Add at least one item'); return; }
  const isNew = !id;
  let doc;
  if(isNew){
    doc = { id:uid(), number: nextNumber(type), stockApplied:false };
    list.push(doc);
  } else {
    doc = list.find(d=>d.id===id);
  }
  doc.customer=customer;
  doc.phone=document.getElementById('f_phone').value.trim();
  doc.email=document.getElementById('f_email').value.trim();
  doc.date=document.getElementById('f_date').value||todayISO();
  doc.dueDate=document.getElementById('f_due').value||'';
  doc.status=document.getElementById('f_status').value;
  doc.items=items;
  doc.vatOn=document.getElementById('f_vat').checked;
  doc.vatRate=S.settings.vatRate;
  doc.discountPct=Number(document.getElementById('f_disc').value)||0;
  doc.notes=document.getElementById('f_notes').value;

  // Stock effect: invoices reduce stock once, on first save
  if(type==='invoice' && isNew){
    items.forEach(it=>{ if(it.invId) adjustStock(it.invId, -Number(it.qty||0)); });
    doc.stockApplied=true;
    persist('inventory');
  }

  persist(type==='invoice'?'invoices':'quotes');
  persist('settings');
  toast(`${type[0].toUpperCase()+type.slice(1)} saved`);
  goBack();
}
function deleteDoc(type,id){
  if(!isAdmin()){ toast('Only admins can delete'); return; }
  if(!confirm('Delete this document? This cannot be undone.')) return;
  const key = type==='invoice'?'invoices':'quotes';
  const list = S[key];
  const item = list.find(d=>d.id===id);
  if(type==='invoice' && item && item.stockApplied){
    item.items.forEach(it=>{ if(it.invId) adjustStock(it.invId, Number(it.qty||0)); });
    persist('inventory');
  }
  S[key]=list.filter(d=>d.id!==id);
  persist(key);
  toast('Deleted');
  goBack();
}

function quickStatus(type,id,val){

  render();

function convertQuote(id){
  const q = S.quotes.find(x=>x.id===id);
  if(!q) return;
  const inv = {...q, id:uid(), number: nextNumber('invoice'), status:'draft', stockApplied:false};
  S.invoices.push(inv);
  q.status='converted';
  // apply stock for the new invoice
  inv.items.forEach(it=>{ if(it.invId) adjustStock(it.invId, -Number(it.qty||0)); });
  inv.stockApplied=true;
  persist('invoices'); persist('quotes'); persist('inventory'); persist('settings');
  toast('Converted to invoice');
  go('invoice-view',{id:inv.id});
}

    </div>

}
function renderPurchaseRows(items){
  return items.map((it,idx)=>`
    <div class="item-row-p" data-idx="${idx}">
      <input list="invDatalist2" placeholder="Item description" value="${esc(it.desc)}" oninput="onPurchaseDescChange(${idx},this.value)" class="pDesc">
      <div class="item-grid">
        <div><label style="margin-top:8px">Qty</label><input type="number" min="0" step="1" value="${it.qty}" oninput="purchaseLiveTotals()" class="pQty"></div>
        <div><label style="margin-top:8px">Unit cost</label><input type="number" min="0" step="0.01" value="${it.cost}" oninput="purchaseLiveTotals()" class="pCost"></div>
      </div>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px;width:100%" onclick="removePurchaseRow(${idx})">${ic('trash')} Remove</button>
    </div>`).join('') + `<datalist id="invDatalist2">${S.inventory.map(i=>`<option value="${esc(i.name)}">`).join('')}</datalist>`;
}
function readPurchaseItemsFromDOM(){
  return [...document.querySelectorAll('.item-row-p')].map(r=>{
    const desc=r.querySelector('.pDesc').value.trim();
    const match=findInventoryByName(desc);
    return {desc, qty:Number(r.querySelector('.pQty').value)||0, cost:Number(r.querySelector('.pCost').value)||0, invId:match?match.id:null};
  }).filter(r=>r.desc||r.qty||r.cost);
}
function onPurchaseDescChange(idx,val){
  const match=findInventoryByName(val);
  if(match){ const rows=[...document.querySelectorAll('.item-row-p')]; if(rows[idx]) rows[idx].querySelector('.pCost').value=match.costPrice; }
  purchaseLiveTotals();
}
function addPurchaseRow(){
  const items=readPurchaseItemsFromDOM(); items.push({desc:'',qty:1,cost:0,invId:null});
  document.getElementById('pItemsWrap').innerHTML=renderPurchaseRows(items); purchaseLiveTotals();
}
function removePurchaseRow(idx){
  const items=readPurchaseItemsFromDOM(); items.splice(idx,1);
  if(items.length===0) items.push({desc:'',qty:1,cost:0,invId:null});
  document.getElementById('pItemsWrap').innerHTML=renderPurchaseRows(items); purchaseLiveTotals();
}
function purchaseLiveTotals(){
  const box=document.getElementById('pTotalsBox'); if(!box) return;
  const items=readPurchaseItemsFromDOM();
  const total=items.reduce((a,b)=>a+(Number(b.qty)||0)*(Number(b.cost)||0),0);
  box.innerHTML=`<div class="line grand"><span>Total cost</span><span class="mono">${fmtMoney(total)}</span></div>`;
}
function applyPurchaseStock(p){
  p.items.forEach(it=>{
    if(it.invId){ adjustStock(it.invId, Number(it.qty||0)); const inv=S.inventory.find(x=>x.id===it.invId); if(inv) inv.costPrice=Number(it.cost)||inv.costPrice; }
  });
  p.stockApplied=true;
}
function reversePurchaseStock(p){
  p.items.forEach(it=>{ if(it.invId) adjustStock(it.invId, -Number(it.qty||0)); });
  p.stockApplied=false;
}
function savePurchase(id){
  const supplier=document.getElementById('p_supplier').value.trim();
  if(!supplier){ toast('Enter a supplier name'); return; }
  const items=readPurchaseItemsFromDOM();
  if(items.length===0){ toast('Add at least one item'); return; }
  const isNew=!id; let p;
  if(isNew){ p={id:uid(),number:nextNumber('purchase'),stockApplied:false}; S.purchases.push(p); }
  else {
    p=S.purchases.find(x=>x.id===id);
    if(p.stockApplied) reversePurchaseStock(p); // undo old quantities before applying edited ones
  }
  p.supplier=supplier;
  p.date=document.getElementById('p_date').value||todayISO();
  p.status=document.getElementById('p_status').value;
  p.items=items;
  p.notes=document.getElementById('p_notes').value;
  if(p.status==='received'){
    applyPurchaseStock(p);
    persist('inventory');
  }
  persist('purchases'); persist('settings');
  toast(p.status==='received' ? 'Purchase saved — stock added to inventory' : 'Purchase saved');
  goBack();
}
function deletePurchase(id){
  if(!isAdmin()){ toast('Only admins can delete'); return; }
  if(!confirm('Delete this purchase?')) return;
  const p=S.purchases.find(x=>x.id===id);
  if(p && p.stockApplied){ reversePurchaseStock(p); persist('inventory'); }
  S.purchases=S.purchases.filter(x=>x.id!==id);
  persist('purchases');
  toast('Deleted');
  goBack();
}
function renderPurchaseView(id){
  const p=S.purchases.find(x=>x.id===id);
  if(!p) return topbar('Not found','',true)+`<div class="content">${emptyState('cart','Not found','')}</div>`;
  const total=p.items.reduce((a,b)=>a+(Number(b.qty)||0)*(Number(b.cost)||0),0);
  return `
  ${topbar(p.number,p.supplier,true)}
  <div class="content">
    <div class="card">
      <div class="row-between"><div style="font-weight:600">${esc(p.supplier)}</div><span class="badge ${p.status}">${p.status}</span></div>
      <div class="tiny muted">${fmtDate(p.date)}</div>
    </div>
    <div class="card">
      ${p.items.map(it=>`<div class="row-between" style="padding:6px 0;border-bottom:1px solid var(--line)">
        <div class="small">${esc(it.desc)} <span class="muted tiny mono">×${it.qty}</span></div>
        <div class="mono">${fmtMoney(it.qty*it.cost)}</div></div>`).join('')}
      <div class="totals"><div class="line grand"><span>Total</span><span class="mono">${fmtMoney(total)}</span></div></div>
    </div>
    ${p.notes?`<div class="card"><div class="small">${esc(p.notes)}</div></div>`:''}
    <select onchange="quickPurchaseStatus('${p.id}',this.value)">
      ${['pending','received'].map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}
    </select>
    <div style="height:10px"></div>
    <button class="btn btn-ghost btn-block" onclick="go('purchase-form',{id:'${p.id}'})">${ic('edit')} Edit</button>
  </div>`;
}
function quickPurchaseStatus(id,val){
  const p=S.purchases.find(x=>x.id===id);
  p.status=val;
  if(val==='received' && !p.stockApplied){ applyPurchaseStock(p); persist('inventory'); toast('Stock added to inventory'); }
  else if(val!=='received' && p.stockApplied){ reversePurchaseStock(p); persist('inventory'); }
  persist('purchases');
  render();
}

/* ---------- REPORTS ---------- */
let REPORT_RANGE='month';
function rangeDates(){
  const now=new Date(); let start,end;
  if(REPORT_RANGE==='month'){ start=new Date(now.getFullYear(),now.getMonth(),1); end=new Date(now.getFullYear(),now.getMonth()+1,0); }
  else if(REPORT_RANGE==='lastmonth'){ start=new Date(now.getFullYear(),now.getMonth()-1,1); end=new Date(now.getFullYear(),now.getMonth(),0); }
  else if(REPORT_RANGE==='year'){ start=new Date(now.getFullYear(),0,1); end=new Date(now.getFullYear(),11,31); }
  else { start=new Date(2000,0,1); end=new Date(2100,0,1); }
  return {start:start.toISOString().slice(0,10), end:end.toISOString().slice(0,10)};
}
function inRange(dateStr,start,end){ return dateStr>=start && dateStr<=end; }

function renderReports(){
  const {start,end} = rangeDates();
  const invs = S.invoices.filter(i=>inRange(i.date,start,end));
  const purs = S.purchases.filter(p=>inRange(p.date,start,end));

  let sales=0, vatCollected=0, outstanding=0, discountGiven=0;
  const itemTotals={};
  invs.forEach(i=>{
    const t=calcTotals(i.items,i.vatOn,i.vatRate,i.discountPct);
    sales+=t.total; vatCollected+=t.vatAmt; discountGiven+=t.overallDiscAmt;
    outstanding+=remaining(i);
    t.calced.forEach(it=>{ itemTotals[it.desc]=(itemTotals[it.desc]||0)+it.net; });
  });
  const paid = S.invoices.reduce((a,i)=> a + (i.payments||[]).filter(p=>inRange(p.date,start,end)).reduce((x,p)=>x+(Number(p.amount)||0),0), 0);
  const purchaseTotal = purs.reduce((a,p)=>a+p.items.reduce((x,y)=>x+(Number(y.qty)||0)*(Number(y.cost)||0),0),0);
  const grossMargin = sales - purchaseTotal;
  const topItems = Object.entries(itemTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxTop = topItems.length? topItems[0][1] : 1;
  const lowStock = S.inventory.filter(i=>Number(i.stock)<=Number(i.lowStockThreshold||0));
  const outstandingInvoices = S.invoices.filter(i=>remaining(i)>0);

  return `
  ${topbar('Reports','Business overview')}
  <div class="content">
    <div class="chip-row">
      ${[['month','This month'],['lastmonth','Last month'],['year','This year'],['all','All time']].map(([k,l])=>
        `<div class="chip ${REPORT_RANGE===k?'active':''}" onclick="REPORT_RANGE='${k}';render()">${l}</div>`).join('')}
    </div>
    <div style="height:12px"></div>
    <div class="grid2">
      <div class="stat"><div class="num">${fmtMoney(sales)}</div><div class="lbl">Total sales</div></div>
      <div class="stat"><div class="num">${fmtMoney(vatCollected)}</div><div class="lbl">VAT collected</div></div>
      <div class="stat"><div class="num">${fmtMoney(paid)}</div><div class="lbl">Paid</div></div>
      <div class="stat"><div class="num" style="color:${outstanding>0?'var(--amber)':'inherit'}">${fmtMoney(outstanding)}</div><div class="lbl">Outstanding</div></div>
      <div class="stat"><div class="num">${fmtMoney(purchaseTotal)}</div><div class="lbl">Purchases</div></div>
      <div class="stat"><div class="num" style="color:${grossMargin>=0?'var(--green)':'var(--red)'}">${fmtMoney(grossMargin)}</div><div class="lbl">Gross margin</div></div>
    </div>

    <div class="section-title">Top items / services</div>
    <div class="card">
      ${topItems.length===0? `<div class="tiny muted">No sales in this period yet.</div>` :
        topItems.map(([name,val])=>`
          <div class="bar-wrap">
            <div style="width:96px;font-size:12px" class="muted">${esc(name.slice(0,16))}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(val/maxTop)*100)}%"></div></div>
            <div class="mono tiny" style="width:70px;text-align:right">${fmtMoney(val)}</div>
          </div>`).join('')}
    </div>

    <div class="section-title">Outstanding invoices</div>
    ${outstandingInvoices.length===0? `<div class="card"><div class="tiny muted">All caught up — nothing outstanding.</div></div>` :
      `<div class="card" style="padding:6px 14px">
        ${outstandingInvoices.map(i=>{
          return `<div class="row-between" style="padding:8px 0;border-bottom:1px solid var(--line)" onclick="go('invoice-view',{id:'${i.id}'})">
            <div><div class="small" style="font-weight:600">${esc(i.customer)}</div><div class="tiny muted mono">${i.number}${paymentsSum(i)>0?' · partly paid':''}</div></div>
            <div class="mono">${fmtMoney(remaining(i))}</div>
          </div>`;
        }).join('')}
      </div>`}

    <div class="section-title">Low stock</div>
    ${lowStock.length===0? `<div class="card"><div class="tiny muted">Stock levels look healthy.</div></div>` :
      `<div class="card">${lowStock.map(i=>`<div class="row-between" style="padding:5px 0"><div class="small">${esc(i.name)}</div><div class="mono tiny" style="color:var(--red)">${i.stock} left</div></div>`).join('')}</div>`}

    <div class="section-title">Discounts given</div>
    <div class="card"><div class="row-between"><div class="small muted">Total discounted this period</div><div class="mono">${fmtMoney(discountGiven)}</div></div></div>
  </div>`;
}

function renderTeamForm(){
  const staff = S.users.filter(u=>u.id!==CURRENT_USER.id);
  return `
  ${topbar('Team & logins','',true)}
  <div class="content">
    <div class="section-title">Add a team member</div>
    <div class="card">
      <label>Name</label><input id="t_name" placeholder="Full name">
      <label>Username</label><input id="t_user" placeholder="username" autocapitalize="off">
      <label>PIN / passcode (min 4 characters)</label><input id="t_pin" type="password" placeholder="••••">

      <select id="t_role">

      </select>

      <button class="btn btn-primary btn-block" style="margin-top:6px" onclick="addTeamMember()">${ic('plus')} Add member</button>
    </div>
    <div class="section-title">Team</div>
    ${staff.length===0? `<div class="card"><div class="tiny muted">Just you so far — add teammates above.</div></div>` :
      staff.map(u=>`<div class="card row-between">
        <div><div class="small" style="font-weight:600">${esc(u.name)}</div><div class="tiny muted">@${esc(u.username)} · ${u.role==='admin'?'Admin':'Staff'}</div></div>
        <button class="btn btn-danger btn-sm" onclick="removeTeamMember('${u.id}')">${ic('trash')}</button>
      </div>`).join('')}

}
async function addTeamMember(){
  const name=document.getElementById('t_name').value.trim();
  const username=document.getElementById('t_user').value.trim().toLowerCase();
  const pin=document.getElementById('t_pin').value;
  const role=document.getElementById('t_role').value;
  const err=document.getElementById('t_err');
  if(!name||!username||pin.length<4){ err.textContent='Fill in all fields — PIN needs 4+ characters.'; return; }
  if(S.users.some(u=>u.username===username)){ err.textContent='That username is already taken.'; return; }
  const passHash=await sha256(username+':'+pin);
  S.users.push({id:uid(), name, username, passHash, role});
  await persist('users');
  toast('Team member added');
  render();
}
function removeTeamMember(id){
  if(!confirm('Remove this team member? They will no longer be able to sign in.')) return;
  S.users=S.users.filter(u=>u.id!==id);
  persist('users');
  toast('Removed');
  render();
}

  const s=S.settings;
  return `
  ${topbar('Business settings','',true)}
  <div class="content">
    <div class="card">
      <label>Company name</label><input id="s_name" value="${esc(s.companyName)}">
      <label>Phone</label><input id="s_phone" value="${esc(s.companyPhone)}">
      <label>Email</label><input id="s_email" value="${esc(s.companyEmail)}">
      <label>Address</label><textarea id="s_addr" rows="2">${esc(s.companyAddress)}</textarea>
    </div>
    <div class="card">
      <div class="item-grid">
        <div><label>Currency code</label><input id="s_cur" value="${esc(s.currency)}" placeholder="AED"></div>
        <div><label>Default VAT rate (%)</label><input id="s_vat" type="number" min="0" step="0.5" value="${s.vatRate}"></div>
      </div>
      <div class="toggle-row">
        <div class="small" style="font-weight:600">VAT on by default</div>

    <div class="card">
      <label>Invoice prefix</label><input id="s_pinv" value="${esc(s.invoicePrefix)}">
      <label>Quote prefix</label><input id="s_pquo" value="${esc(s.quotePrefix)}">

function saveSettings(){
  if(!isAdmin()){ toast('Only admins can change settings'); return; }
  const s=S.settings;
  s.companyName=document.getElementById('s_name').value.trim()||'The H IT Solutions';
  s.companyPhone=document.getElementById('s_phone').value.trim();
  s.companyEmail=document.getElementById('s_email').value.trim();
  s.companyAddress=document.getElementById('s_addr').value.trim();
  s.currency=document.getElementById('s_cur').value.trim()||'AED';
  s.vatRate=Number(document.getElementById('s_vat').value)||0;
  s.vatDefaultOn=document.getElementById('s_vatdef').checked;
  s.invoicePrefix=document.getElementById('s_pinv').value.trim()||'INV';
  s.quotePrefix=document.getElementById('s_pquo').value.trim()||'QT';
  s.poPrefix=document.getElementById('s_ppo').value.trim()||'PO';
  persist('settings');
  toast('Settings saved');
  goBack();
}
