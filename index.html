<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Ledger — IT Business Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F8;
    --surface:#FFFFFF;
    --ink:#152033;
    --ink-soft:#5B6B82;
    --line:#E3E8EE;
    --navy:#152A4D;
    --navy-2:#1F3A63;
    --teal:#0E9C90;
    --teal-soft:#E3F5F3;
    --amber:#C77F16;
    --amber-soft:#FBF0DD;
    --red:#C4383D;
    --red-soft:#FBE7E7;
    --green:#2E8B4F;
    --green-soft:#E7F5EC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px;}
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--navy);
    color:#fff;
    padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex;align-items:center;gap:10px;
  }
  .topbar .back{
    width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;border:none;color:#fff;
  }
  .topbar .title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .topbar .sub{font-size:11px;color:rgba(255,255,255,.55);font-family:'IBM Plex Mono',monospace;margin-top:1px;}
  .content{padding:14px 14px 8px;}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
  }
  .stripe{
    border-left:4px solid var(--line);
    padding-left:12px;
  }
  .stripe.paid,.stripe.received,.stripe.accepted{border-left-color:var(--green);}
  .stripe.sent,.stripe.draft{border-left-color:var(--ink-soft);}
  .stripe.overdue{border-left-color:var(--red);}
  .stripe.pending{border-left-color:var(--amber);}
  .stripe.partial{border-left-color:var(--amber);}
  .stripe.planning{border-left-color:var(--ink-soft);}
  .stripe.active{border-left-color:var(--teal);}
  .stripe.completed{border-left-color:var(--green);}
  .stripe.on-hold{border-left-color:var(--amber);}
  .badge{
    display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
    font-family:'IBM Plex Mono',monospace;
  }
  .badge.paid,.badge.received,.badge.accepted{background:var(--green-soft);color:var(--green);}
  .badge.sent{background:var(--teal-soft);color:var(--teal);}
  .badge.draft{background:#EEF1F5;color:var(--ink-soft);}
  .badge.overdue{background:var(--red-soft);color:var(--red);}
  .badge.pending{background:var(--amber-soft);color:var(--amber);}
  .badge.partial{background:var(--amber-soft);color:var(--amber);}
  .badge.converted{background:#EEF1F5;color:var(--ink-soft);}
  .badge.planning{background:#EEF1F5;color:var(--ink-soft);}
  .badge.active{background:var(--teal-soft);color:var(--teal);}
  .badge.completed{background:var(--green-soft);color:var(--green);}
  .badge.on-hold{background:var(--amber-soft);color:var(--amber);}
  .activity-avatar.paid,.activity-avatar.received,.activity-avatar.accepted{background:var(--green-soft);color:var(--green);}
  .activity-avatar.sent{background:var(--teal-soft);color:var(--teal);}
  .activity-avatar.draft{background:#EEF1F5;color:var(--ink-soft);}
  .activity-avatar.overdue{background:var(--red-soft);color:var(--red);}
  .activity-avatar.pending,.activity-avatar.partial{background:var(--amber-soft);color:var(--amber);}
  .row-between{display:flex;align-items:center;justify-content:space-between;}
  .muted{color:var(--ink-soft);}
  .small{font-size:12.5px;}
  .tiny{font-size:11px;}
  .btn{
    border:none;border-radius:11px;padding:12px 16px;font-weight:600;font-size:14.5px;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-ghost{background:var(--surface);color:var(--navy);border:1px solid var(--line);}
  .btn-danger{background:var(--red-soft);color:var(--red);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px;font-size:13px;border-radius:9px;}
  input,select,textarea{
    width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:10px 11px;font-size:14.5px;color:var(--ink);font-family:'IBM Plex Sans',sans-serif;
    outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--navy-2);}
  label{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:5px;margin-top:12px;}
  label:first-child{margin-top:0;}
  .field{margin-bottom:2px;}
  .item-row{
    border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#FAFBFC;
  }
  .item-grid{display:flex;gap:8px;margin-top:8px;}
  .item-grid>div{flex:1 1 0;min-width:0;}
  .item-grid input,.item-grid select{min-width:0;max-width:100%;}
  .totals{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px;}
  .totals .line{display:flex;justify-content:space-between;padding:3px 0;font-size:14px;}
  .totals .line.grand{font-weight:700;font-size:17px;font-family:'Space Grotesk',sans-serif;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;}
  .tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
    background:var(--surface);border-top:1px solid var(--line);
    display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
    z-index:30;
  }
  .tabbtn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
    background:none;border:none;color:var(--ink-soft);font-size:10.5px;font-weight:600;
    cursor:pointer;font-family:'IBM Plex Sans',sans-serif;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .tabbtn:active{transform:scale(.88);}
  .tabbtn.active{color:var(--navy);}
  .tabbtn svg{width:20px;height:20px;position:relative;z-index:1;}
  .tab-icon-wrap{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:42px;height:26px;border-radius:14px;margin-bottom:1px;
  }
  .tabbtn.active .tab-icon-wrap{
    background:var(--teal-soft);
    animation:tabPillIn .32s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes tabPillIn{0%{transform:scale(.55);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .tabbtn.active svg{animation:tabIconPop .4s cubic-bezier(.34,1.56,.64,1);}
  @keyframes tabIconPop{0%{transform:scale(1);}45%{transform:scale(1.22);}100%{transform:scale(1);}}
  .tabbtn.active span:last-child{animation:tabLabelIn .3s ease;}
  @keyframes tabLabelIn{0%{opacity:0;transform:translateY(2px);}100%{opacity:1;transform:translateY(0);}}
  .tabbtn-home{position:relative;justify-content:flex-end;}
  .tabbtn-home span:last-child{font-weight:700;}
  .home-circle{
    width:50px;height:50px;border-radius:50%;flex-shrink:0;
    background:#204a80;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 22px rgba(21,32,51,.18),0 0 0 5px var(--surface);
    margin-top:-30px;margin-bottom:2px;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;
  }
  .home-circle img{width:30px;height:30px;object-fit:contain;}
  .tabbtn-home:active .home-circle{transform:scale(.88);}
  .tabbtn-home.active .home-circle{animation:homePulse 2.6s ease-in-out infinite;}
  @keyframes homePulse{
    0%,100%{box-shadow:0 10px 22px rgba(21,32,51,.18),0 0 0 5px var(--surface),0 0 0 0 rgba(46,139,79,.5);}
    50%{box-shadow:0 10px 22px rgba(21,32,51,.18),0 0 0 5px var(--surface),0 0 0 10px rgba(46,139,79,0);}
  }

  /* ---------- FACE ID LOGIN ---------- */
  .faceid-wrap{display:flex;flex-direction:column;align-items:center;gap:9px;margin-bottom:20px;cursor:pointer;user-select:none;}
  .faceid-frame{
    position:relative;width:76px;height:76px;border-radius:22px;
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px rgba(21,32,51,.25);
    transition:transform .15s ease,background .35s ease,box-shadow .35s ease;
  }
  .faceid-wrap:active .faceid-frame{transform:scale(.94);}
  .faceid-svg{width:46px;height:46px;overflow:visible;}
  .fi-corner{stroke:rgba(255,255,255,.9);fill:none;stroke-dasharray:1;stroke-dashoffset:1;animation:fiDraw .5s ease forwards;transition:stroke .25s ease;}
  .fi-tl{animation-delay:.05s;} .fi-tr{animation-delay:.12s;}
  .fi-bl{animation-delay:.19s;} .fi-br{animation-delay:.26s;}
  @keyframes fiDraw{to{stroke-dashoffset:0;}}
  .fi-face{transform-origin:50px 50px;transition:opacity .25s ease,transform .3s ease;}
  .fi-eye{fill:#fff;opacity:0;animation:fiFadeIn .3s ease forwards;animation-delay:.42s;}
  .fi-mouth{stroke:#fff;fill:none;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:fiMouthDraw .4s ease forwards;animation-delay:.48s;}
  @keyframes fiFadeIn{to{opacity:1;}}
  @keyframes fiMouthDraw{to{opacity:1;stroke-dashoffset:0;}}
  .fi-check{
    stroke:#fff;fill:none;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;
    transition:stroke-dashoffset .45s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;
  }
  .fi-scanline{stroke:#3DDC97;opacity:0;}
  .faceid-frame.idle{animation:faceidPulse 2.4s ease-in-out infinite;animation-delay:.6s;}
  @keyframes faceidPulse{
    0%,100%{box-shadow:0 10px 24px rgba(21,32,51,.25),0 0 0 0 rgba(14,156,144,.4);}
    50%{box-shadow:0 10px 24px rgba(21,32,51,.25),0 0 0 10px rgba(14,156,144,0);}
  }
  .faceid-frame.scanning .fi-scanline{opacity:1;animation:fiScan 1.1s ease-in-out infinite;}
  .faceid-frame.scanning .fi-corner{animation:fiCornerGlow 1.1s ease-in-out infinite;}
  @keyframes fiScan{
    0%{transform:translateY(-22px);opacity:0;} 15%{opacity:1;} 85%{opacity:1;} 100%{transform:translateY(22px);opacity:0;}
  }
  @keyframes fiCornerGlow{
    0%,100%{stroke:rgba(255,255,255,.65);} 50%{stroke:#3DDC97;}
  }
  .faceid-frame.success{animation:none;background:linear-gradient(135deg,#0E9C90,#166B54);box-shadow:0 10px 24px rgba(21,32,51,.25),0 0 0 8px rgba(61,220,151,.28);}
  .faceid-frame.success .fi-face{opacity:0;transform:scale(.5);}
  .faceid-frame.success .fi-corner{stroke:#fff;}
  .faceid-frame.success .fi-check{opacity:1;stroke-dashoffset:0;}
  .faceid-frame.failed{animation:fiShake .4s ease;background:linear-gradient(135deg,var(--red),#7a2323);}
  .faceid-frame.failed .fi-corner{stroke:#fff;}
  @keyframes fiShake{
    10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-6px);} 40%,60%{transform:translateX(6px);}
  }
  .faceid-label{font-weight:700;font-size:15px;color:var(--ink);}
  .faceid-sub{font-size:12px;color:var(--ink-soft);transition:color .2s;}
  .faceid-sub.error{color:var(--red);font-weight:600;}
  .faceid-divider{font-size:11px;color:var(--ink-soft);text-align:center;margin-bottom:14px;}
  .fab{
    position:fixed;bottom:calc(78px + 1cm);right:max(16px,calc(50vw - 260px + 16px));
    width:52px;height:52px;border-radius:16px;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;
    box-shadow:0 8px 20px rgba(14,156,144,.35);z-index:25;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1);
    animation:fabPulse 2.8s ease-in-out infinite;
  }
  .fab:active{transform:scale(.85);}
  @keyframes fabPulse{
    0%,100%{box-shadow:0 8px 20px rgba(14,156,144,.35),0 0 0 0 rgba(14,156,144,.4);}
    50%{box-shadow:0 8px 20px rgba(14,156,144,.35),0 0 0 8px rgba(14,156,144,0);}
  }
  .empty{text-align:center;padding:40px 16px;color:var(--ink-soft);}
  .empty svg{width:40px;height:40px;margin-bottom:10px;opacity:.5;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;}
  .stat .num{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;}
  .stat .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);}
  .toggle-row:last-child{border-bottom:none;}
  .switch{position:relative;width:42px;height:24px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#D7DDE5;border-radius:24px;cursor:pointer;transition:.15s;}
  .slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  input:checked + .slider{background:var(--teal);}
  input:checked + .slider:before{transform:translateX(18px);}
  .bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .bar-track{flex:1;height:9px;background:#EEF1F5;border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--teal);border-radius:6px;}
  .section-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;margin:18px 0 10px;color:var(--ink);}
  .section-title:first-child{margin-top:0;}

  /* ---------- DASHBOARD (Home) ---------- */
  @keyframes dashRise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .dash-hero{
    position:relative;overflow:hidden;isolation:isolate;
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 55%,#204a80 100%);
    color:#fff;padding:16px 16px 50px;
    padding-top:calc(16px + env(safe-area-inset-top,0px));
  }
  .dash-hero::before{
    content:'';position:absolute;top:-70px;right:-50px;width:210px;height:210px;z-index:-1;
    background:radial-gradient(circle,rgba(14,156,144,.4),transparent 70%);border-radius:50%;
  }
  .dash-hero::after{
    content:'';position:absolute;bottom:-90px;left:-50px;width:190px;height:190px;z-index:-1;
    background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);border-radius:50%;
  }
  .dash-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;animation:dashRise .5s ease both;}
  .dash-hero-menu{
    width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.1);border:none;color:#fff;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
  }
  .dash-hero-menu svg{width:17px;height:17px;}
  .dash-greeting{font-size:11px;color:rgba(255,255,255,.62);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;}
  .dash-company{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;margin-top:2px;line-height:1.25;}
  .dash-date{font-size:11px;color:rgba(255,255,255,.6);text-align:right;font-family:'IBM Plex Mono',monospace;white-space:nowrap;margin-top:2px;}
  .dash-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:-36px 14px 0;position:relative;animation:dashRise .55s ease .05s both;
  }
  .dash-stat{
    background:var(--surface);border-radius:16px;padding:13px;
    box-shadow:0 14px 28px rgba(21,32,51,.14);
    display:flex;flex-direction:column;gap:9px;transition:transform .18s ease;
  }
  .dash-stat:active{transform:scale(.96);}
  .dash-stat-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dash-stat-icon svg{width:15px;height:15px;}
  .dash-stat .num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
  .dash-stat .lbl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .dash-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;animation:dashRise .55s ease .1s both;}
  .dash-action{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:13px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;
    cursor:pointer;transition:transform .15s ease;text-align:left;width:100%;
    font-family:'IBM Plex Sans',sans-serif;color:var(--ink);
  }
  .dash-action:active{transform:scale(.95);}
  .dash-action.primary{background:linear-gradient(135deg,var(--navy),var(--navy-2));border-color:transparent;color:#fff;}
  .dash-action .ic-wrap{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--navy);}
  .dash-action.primary .ic-wrap{background:rgba(255,255,255,.16);color:#fff;}
  .dash-action .ic-wrap svg{width:16px;height:16px;}
  .dash-action .lbl{font-weight:600;font-size:13.5px;}
  .dash-section{animation:dashRise .55s ease .15s both;}
  .activity-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .activity-row:last-child{border-bottom:none;}
  .activity-avatar{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .activity-avatar svg{width:16px;height:16px;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.5);z-index:40;display:flex;align-items:flex-end;}
  .modal-sheet{background:var(--surface);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;}
  .modal-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 12px;}
  .segmented{display:flex;background:#EEF1F5;border-radius:10px;padding:3px;gap:3px;}
  .segmented button{flex:1;border:none;background:none;padding:8px 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:'IBM Plex Sans',sans-serif;}
  .segmented button.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .chip-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .chip{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  ::-webkit-scrollbar{display:none;}
  .low-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:5px;}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:500;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.25);}
  @media print{
    .topbar, .tabbar, .fab, .btn, #modalRoot, .toast, select{ display:none !important; }
    #app{ padding-bottom:0 !important; max-width:none !important; }
    body{ background:#fff !important; }
  }

  /* ---------- PROFESSIONAL DOCUMENT (print & PDF export) ---------- */
  #pdfPrintRoot{ display:none; }
  .pdf-page{
    width:210mm; min-height:285mm; margin:0 auto; background:#fff; color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif; font-size:12px; line-height:1.5;
    padding:16mm 16mm 14mm; box-sizing:border-box; display:flex; flex-direction:column;
  }
  .pdf-topbar{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; border-bottom:3px solid var(--navy); padding-bottom:16px; margin-bottom:22px; }
  .pdf-company-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; color:var(--navy); }
  .pdf-company-meta{ font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.6; }
  .pdf-doc-title{ text-align:right; flex-shrink:0; }
  .pdf-doc-title .kind{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:21px; letter-spacing:.03em; color:var(--navy); text-transform:uppercase; }
  .pdf-doc-title .num{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; margin-top:5px; color:var(--ink-soft); }
  .pdf-doc-title .badge{ margin-top:9px; font-size:10.5px; padding:5px 13px; }
  .pdf-meta-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:22px; }
  .pdf-meta-block .label{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; margin-bottom:5px; }
  .pdf-meta-block .name{ font-weight:700; font-size:13.5px; }
  .pdf-meta-block .row{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .pdf-meta-block .kv{ display:flex; justify-content:space-between; font-size:11.5px; padding:3px 0; gap:16px; }
  .pdf-table{ width:100%; border-collapse:collapse; margin-bottom:4px; }
  .pdf-table th{ background:var(--navy); color:#fff; font-size:10px; text-transform:uppercase; letter-spacing:.04em; padding:9px 10px; text-align:left; font-weight:600; }
  .pdf-table th.num, .pdf-table td.num{ text-align:right; }
  .pdf-table td{ padding:8px 10px; border-bottom:1px solid var(--line); font-size:11.5px; vertical-align:top; }
  .pdf-table tbody tr:nth-child(even) td{ background:#F7F9FB; }
  .pdf-totals{ width:280px; margin-left:auto; margin-top:12px; }
  .pdf-totals .line{ display:flex; justify-content:space-between; padding:5px 0; font-size:12px; }
  .pdf-totals .line.muted{ color:var(--ink-soft); }
  .pdf-totals .grand{ border-top:2px solid var(--navy); margin-top:5px; padding-top:9px; font-weight:700; font-size:14.5px; }
  .pdf-totals .balance{ background:var(--red-soft); color:var(--red); border-radius:8px; padding:9px 11px; margin-top:8px; font-weight:700; display:flex; justify-content:space-between; }
  .pdf-totals .balance.zero{ background:var(--green-soft); color:var(--green); }
  .pdf-notes{ margin-top:26px; padding-top:14px; border-top:1px solid var(--line); font-size:11px; color:var(--ink-soft); }
  .pdf-notes .label{ font-weight:700; text-transform:uppercase; font-size:10px; letter-spacing:.05em; color:var(--ink); margin-bottom:5px; }
  .pdf-footer{ margin-top:auto; padding-top:22px; text-align:center; font-size:10px; color:var(--ink-soft); }
  @media print{
    body *{ visibility:hidden; }
    #pdfPrintRoot, #pdfPrintRoot *{ visibility:visible; }
    #pdfPrintRoot{ display:block; position:absolute; inset:0; margin:0; }
    .pdf-page{ width:auto; min-height:0; margin:0; padding:0; }
    @page{ size:A4; margin:14mm; }
  }
</style>
</head>

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isAdmin(){ return CURRENT_USER && CURRENT_USER.role==='admin'; }
function logActivity(action){
  if(!S.activityLog) S.activityLog=[];
  S.activityLog.unshift({id:uid(), ts:Date.now(), user:CURRENT_USER?CURRENT_USER.name:'System', action});
  if(S.activityLog.length>300) S.activityLog.length=300;
  persist('activityLog');
}

let FIREBASE_ENABLED=false, fbDB=null, fbAuth=null;

let STORAGE_MODE='builtin'; // 'firebase' | 'builtin' | 'none' | 'error'
function initFirebaseAuth(){
  return new Promise((resolve)=>{
    let settled=false;
    const finish=(ok)=>{ if(!settled){ settled=true; resolve(ok); } };
    const overallTimeout=setTimeout(()=>finish(false), 8000);
    fbAuth.onAuthStateChanged(user=>{ if(user){ clearTimeout(overallTimeout); finish(true); } });
    const attempt=()=>{
      fbAuth.signInAnonymously().catch(e=>{
        console.error('anonymous sign-in attempt failed, retrying',e);
        setTimeout(()=>{ if(!settled) attempt(); }, 1000);
      });
    };
    attempt();
  });
}
async function loadAll(){
  if(FIREBASE_CONFIG){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      fbDB = firebase.firestore();
      fbAuth = firebase.auth();
      const ok = await initFirebaseAuth();
      if(ok && fbAuth.currentUser){
        FIREBASE_ENABLED=true; STORAGE_MODE='firebase';
      } else {
        // Firebase IS configured but unreachable right now — never fall through to a
        // "no data" state that could look like a fresh setup. Show a clear retry screen instead.
        STORAGE_MODE='error';
        render();
        return;
      }
    }catch(e){
      console.error('Firebase init failed',e);
      STORAGE_MODE='error';
      render();
      return;
    }
  }

  if(FIREBASE_ENABLED){
    await Promise.all(KEYS.map(async k=>{
      try{
        const snap = await fbDB.collection('ledger').doc(k).get();
        if(snap.exists && snap.data().json) S[k]=JSON.parse(snap.data().json);
      }catch(e){ console.error('firestore read failed',k,e); }
    }));
  } else if(typeof window.storage === 'undefined' || !window.storage){
    // No Claude storage bridge available (e.g. opened as a plain downloaded file, or outside claude.ai)
    STORAGE_MODE='none';
  } else {
    await Promise.all(KEYS.map(async k=>{
      try{
        const r = await window.storage.get(k,true);
        if(r && r.value) S[k] = JSON.parse(r.value);
      }catch(e){ /* not found yet, keep default */ }
    }));
  }
  if(!S.settings || !S.settings.companyName) S.settings = {...DEFAULT_SETTINGS, ...(S.settings||{})};
  render();

  if(FIREBASE_ENABLED){ attachFirestoreListeners(); }
  else if(STORAGE_MODE!=='none'){ startSync(); }
}
const FORM_VIEWS=['invoice-form','quote-form','item-form','purchase-form','settings-form','team-form','bulk-payment','project-form','inventory-import'];

/* Realtime path (Firebase) */
function attachFirestoreListeners(){
  KEYS.forEach(k=>{
    fbDB.collection('ledger').doc(k).onSnapshot(snap=>{
      if(!snap.exists) return;
      const json = snap.data().json;
      if(json===undefined) return;
      const current = JSON.stringify(S[k]);
      if(json!==current){
        S[k]=JSON.parse(json);
        if(!FORM_VIEWS.includes(VIEW.name) && CURRENT_USER){ render(); flashSync(); }
      }
    }, err=>console.error('firestore listener error',k,err));
  });
}

/* Polling fallback path (built-in storage) */
let syncTimer=null, syncing=false;
function startSync(){
  if(syncTimer) return;
  syncTimer = setInterval(syncPull, 6000);
}
async function syncPull(){
  if(STORAGE_MODE==='none' || syncing || FORM_VIEWS.includes(VIEW.name)) return;
  syncing = true;
  const onAuthScreen = !CURRENT_USER; // setup or login — never yank the form out from under typing
  try{
    let changed=false;
    for(const k of KEYS){
      const r = await window.storage.get(k,true);
      const incoming = r && r.value ? r.value : null;
      const current = JSON.stringify(S[k]);
      if(incoming!==null && incoming!==current){ S[k]=JSON.parse(incoming); changed=true; }
    }
    if(changed && !onAuthScreen){ render(); flashSync(); }
  }catch(e){ /* offline or transient — ignore */ }
  syncing = false;
}
function flashSync(){
  const el=document.getElementById('syncDot');
  if(el){ el.style.opacity='1'; setTimeout(()=>{ if(el) el.style.opacity='0'; },1200); }
}
let storageWarned=false;
async function persist(key){
  const payload = JSON.stringify(S[key]);
  if(FIREBASE_ENABLED){
    try{ await fbDB.collection('ledger').doc(key).set({json:payload, updatedAt: Date.now()}); return; }
    catch(e){ console.error('firestore save failed',key,e); toast('Save failed — check connection'); return; }
  }
  if(STORAGE_MODE==='none'){
    if(!storageWarned){ storageWarned=true; toast('Not saved — open this from the Claude conversation, or set up Firebase (More → Sync)'); }
    return; // keep working in-memory for this session even though nothing persists
  }
  try{
    await window.storage.set(key, payload, true);
  }catch(e){
    console.error('storage.set failed, retrying without shared flag',key,e);
    try{
      await window.storage.set(key, payload, false);
      if(!storageWarned){ storageWarned=true; toast('Saved locally only — live sync unavailable right now'); }
    }catch(e2){
      console.error('save failed',key,e2);
      toast('Save failed — check connection, or set up Firebase (More → Sync)');
    }
  }
}

function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function nextNumber(type){
  const s=S.settings;
  if(type==='invoice'){ const n=s.invoiceNext||1; s.invoiceNext=n+1; return `${s.invoicePrefix}-${new Date().getFullYear()}-${String(n).padStart(4,'0')}`; }
  if(type==='quote'){ const n=s.quoteNext||1; s.quoteNext=n+1; return `${s.quotePrefix}-${new Date().getFullYear()}-${String(n).padStart(4,'0')}`; }
  if(type==='purchase'){ const n=s.poNext||1; s.poNext=n+1; return `${s.poPrefix}-${new Date().getFullYear()}-${String(n).padStart(4,'0')}`; }
  if(type==='project'){ const n=s.projectNext||1; s.projectNext=n+1; return `${s.projectPrefix}-${new Date().getFullYear()}-${String(n).padStart(4,'0')}`; }
}

function calcItems(items){
  return items.map(it=>{
    const qty=Number(it.qty)||0, price=Number(it.price)||0, disc=Number(it.discountPct)||0;
    const gross = qty*price;
    const discAmt = gross*(disc/100);
    return {...it, gross, discAmt, net: gross-discAmt};
  });
}
function calcTotals(items, vatOn, vatRate, overallDiscPct){
  const calced = calcItems(items);
  const subtotal = calced.reduce((a,b)=>a+b.net,0);
  const overallDiscAmt = subtotal*((Number(overallDiscPct)||0)/100);
  const afterDisc = subtotal - overallDiscAmt;
  const vatAmt = vatOn ? afterDisc*((Number(vatRate)||0)/100) : 0;
  const total = afterDisc+vatAmt;
  return {calced, subtotal, overallDiscAmt, afterDisc, vatAmt, total};
}

/* ---------- PAYMENTS ---------- */
const PAY_METHODS=['Cash','Card','Bank transfer','Cheque','Other'];
function docTotal(d){ return calcTotals(d.items,d.vatOn,d.vatRate,d.discountPct).total; }
function paymentsSum(d){ return (d.payments||[]).reduce((a,p)=>a+(Number(p.amount)||0),0); }
function remaining(d){ return Math.max(0, docTotal(d) - paymentsSum(d)); }
function refreshPaymentStatus(d){
  const total=docTotal(d), paid=paymentsSum(d);
  if(total>0 && paid>=total-0.005) d.status='paid';
  else if(paid>0) d.status='partial';
  else if(d.status==='paid'||d.status==='partial') d.status='sent';
}

/* ---------- PROJECTS ---------- */
function boqLineTotal(item){ return (Number(item.qty)||0)*(Number(item.unitPrice)||0); }
function boqLineCost(item){ return (Number(item.qty)||0)*(Number(item.unitCost)||0); }
function projectValue(p){ return (p.boq||[]).reduce((a,b)=>a+boqLineTotal(b),0); }
function projectCost(p){ return (p.boq||[]).reduce((a,b)=>a+boqLineCost(b),0); }
function projectProfit(p){ return projectValue(p)-projectCost(p); }
function projectAdvances(p){ return (p.payments||[]).reduce((a,pay)=>a+(Number(pay.amount)||0),0); }
function projectBalance(p){ return Math.max(0, projectValue(p)-projectAdvances(p)); }
function boqProgressPct(p, field){
  const totalQty = (p.boq||[]).reduce((a,b)=>a+(Number(b.qty)||0),0);
  if(totalQty<=0) return 0;
  const doneQty = (p.boq||[]).reduce((a,b)=>a+Math.min(Number(b[field])||0, Number(b.qty)||0),0);
  return Math.min(100, doneQty/totalQty*100);
}
function ensureModalRoot(){
  let m=document.getElementById('modalRoot');
  if(!m){ m=document.createElement('div'); m.id='modalRoot'; document.body.appendChild(m); }
  return m;
}
function closeModal(){ const m=document.getElementById('modalRoot'); if(m) m.innerHTML=''; }
/* In-app confirm dialog — native window.confirm() doesn't fire in some app
   wrappers (e.g. a WKWebView-based iOS shell built in Xcode without the
   confirm-panel delegate implemented), which makes buttons that rely on it
   look completely unresponsive. This never depends on the browser/OS. */
function showConfirm(message, onYes, opts){
  opts = opts || {};
  ensureModalRoot().innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div style="font-size:14.5px;line-height:1.5;margin-bottom:18px">${esc(message)}</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost btn-block" onclick="closeModal()">Cancel</button>
        <button class="btn ${opts.danger===false?'btn-primary':'btn-danger'} btn-block" onclick="__confirmYes()">${esc(opts.label||'Delete')}</button>
      </div>
    </div>
  </div>`;
  window.__confirmYes = ()=>{ closeModal(); onYes(); };
}

  document.getElementById('paymentRowsWrap').innerHTML = PAYMENT_ROWS.map((r,i)=>paymentRowHtml(i,r)).join('');

function updatePaymentRowsTotals(){
  const box=document.getElementById('paymentRowsTotals'); if(!box) return;
  const rows=readPaymentRowsFromDOM();
  const total=rows.reduce((a,r)=>a+(Number(r.amount)||0),0);
  box.innerHTML=`<div class="line grand"><span>Total this batch</span><span class="mono">${fmtMoney(total)}</span></div>`;
}
function savePayments(kind, id){
  const d=payKindStore(kind).find(x=>x.id===id); if(!d) return;
  const rows=readPaymentRowsFromDOM().filter(r=>Number(r.amount)>0);
  if(rows.length===0){ toast('Enter at least one payment amount'); return; }
  if(!d.payments) d.payments=[];
  const total=rows.reduce((a,r)=>a+Number(r.amount),0);
  rows.forEach(r=>{
    d.payments.push({
      id:uid(), amount:Number(r.amount), date:r.date||todayISO(), method:r.method,
      paidTo:r.paidTo.trim()||CURRENT_USER.name, note:r.note.trim(), recordedBy:CURRENT_USER.name
    });
  });
  if(kind==='invoice') refreshPaymentStatus(d);
  persist(payKindKey(kind));
  logActivity(`Recorded ${rows.length>1?rows.length+' payments':'a payment'} totaling ${fmtMoney(total)} on ${kind} ${d.number}`);
  closeModal();
  toast(rows.length>1? `${rows.length} payments recorded` : 'Payment recorded');
  render();
}
function removePayment(kind, id, payId){
  if(!isAdmin()){ toast('Only admins can remove payments'); return; }
  showConfirm('Remove this payment record?', ()=>{
  const d=payKindStore(kind).find(x=>x.id===id); if(!d) return;
  const pay=(d.payments||[]).find(p=>p.id===payId);
  d.payments=(d.payments||[]).filter(p=>p.id!==payId);
  if(kind==='invoice') refreshPaymentStatus(d);
  persist(payKindKey(kind));
  logActivity(`Removed a ${pay?fmtMoney(pay.amount)+' ':''}payment from ${kind} ${d.number}`);
  render();
  });
}

function renderBulkInvoiceRows(){

function autoSplitBulk(){
  const total = Number(document.getElementById('bp_total').value)||0;
  let left = total;
  document.querySelectorAll('.item-row[data-invid]').forEach(row=>{
    const inv = S.invoices.find(x=>x.id===row.dataset.invid);
    const rem = inv? remaining(inv) : 0;
    const alloc = Math.min(rem, Math.max(0,left));
    row.querySelector('.bulkAmt').value = alloc>0 ? alloc.toFixed(2) : '';
    left -= alloc;
  });
  updateBulkTotals();
}
function updateBulkTotals(){
  const box=document.getElementById('bulkTotalsBox');
  if(!box) return;
  const rows=[...document.querySelectorAll('.item-row[data-invid]')];
  const allocated = rows.reduce((a,r)=>a+(Number(r.querySelector('.bulkAmt').value)||0),0);
  const total = Number(document.getElementById('bp_total')?.value)||0;
  const diff = total-allocated;
  box.innerHTML=`
    <div class="line"><span class="muted">Allocated to invoices</span><span class="mono">${fmtMoney(allocated)}</span></div>
    <div class="line grand"><span>${diff<0?'Over-allocated by':'Unallocated'}</span><span class="mono" style="color:${diff<0?'var(--red)':'inherit'}">${fmtMoney(Math.abs(diff))}</span></div>`;
}
function saveBulkPayment(){
  const customer = document.getElementById('bp_customer')?.value;
  if(!customer){ toast('Select a customer'); return; }
  const date=document.getElementById('bp_date').value||todayISO();
  const method=document.getElementById('bp_method').value;
  const paidTo=document.getElementById('bp_to').value.trim()||CURRENT_USER.name;
  const note=document.getElementById('bp_note').value.trim();
  const rows=[...document.querySelectorAll('.item-row[data-invid]')];
  let count=0, totalApplied=0;
  rows.forEach(row=>{
    const amt = Number(row.querySelector('.bulkAmt').value)||0;
    if(amt<=0) return;
    const inv = S.invoices.find(x=>x.id===row.dataset.invid);
    if(!inv) return;
    if(!inv.payments) inv.payments=[];
    inv.payments.push({id:uid(), amount:amt, date, method, paidTo, note, recordedBy:CURRENT_USER.name});
    refreshPaymentStatus(inv);
    count++; totalApplied+=amt;
  });
  if(count===0){ toast('Enter at least one allocation amount'); return; }
  persist('invoices');
  logActivity(`Applied bulk payment of ${fmtMoney(totalApplied)} across ${count} invoice${count>1?'s':''} for ${customer}`);
  toast(`Payment applied to ${count} invoice${count>1?'s':''}`);
  goBack();
}

/* ---------- FACE ID (native app shell only — no-ops in a plain browser) ----------
   The native iOS wrapper calls window.__faceIDUnlock() after Face ID succeeds,
   or window.__faceIDFailed() if it fails/is cancelled. requestFaceIDLogin() asks
   the native shell (via a WKScriptMessageHandler) to trigger the Face ID prompt,
   and drives the scan/success/error animation on the badge while it waits. */
function __faceIDUnlock(){
  const rid = rememberedUserId();
  if(!rid) return false;
  const user = S.users.find(u=>u.id===rid);
  if(!user) return false;
  const badge = document.getElementById('faceidBadge');
  const finish = ()=>{
    CURRENT_USER={id:user.id,name:user.name,username:user.username,role:user.role};
    AUTH_ERR='';
    if(!applyHashRoute()) render();
  };
  if(badge){
    badge.classList.remove('idle','scanning','failed');
    badge.classList.add('success');
    setTimeout(finish, 550); // let the checkmark animation land before switching screens
  } else {
    finish();
  }
  return true;
}
window.__faceIDUnlock = __faceIDUnlock;
function __faceIDFailed(message){
  const badge = document.getElementById('faceidBadge');
  const sub = document.getElementById('faceidSub');
  if(badge){
    badge.classList.remove('scanning');
    badge.classList.add('idle','failed');
    setTimeout(()=>badge.classList.remove('failed'), 400);
  }
  if(sub){ sub.textContent = message || 'Face ID failed — tap to try again'; sub.classList.add('error'); }
}
window.__faceIDFailed = __faceIDFailed;
function requestFaceIDLogin(){
  const badge = document.getElementById('faceidBadge');
  const sub = document.getElementById('faceidSub');
  if(badge){ badge.classList.remove('idle','failed'); badge.classList.add('scanning'); }
  if(sub){ sub.textContent='Scanning…'; sub.classList.remove('error'); }
  try{
    if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.faceID){
      window.webkit.messageHandlers.faceID.postMessage('unlock');
    } else {
      setTimeout(()=>__faceIDFailed('Face ID isn’t available in this browser — use the iOS app.'), 500);
    }
  }catch(e){ __faceIDFailed('Face ID isn’t available here.'); }
}

  // staff can't reach admin-only views directly

      </div>
      <div class="item-grid">
        <div><label style="margin-top:8px">Discount %</label><input type="number" min="0" max="100" step="1" value="${it.discountPct||0}" oninput="liveTotals()" class="rowDiscount"></div>

function readItemsFromDOM(){
  const rows=[...document.querySelectorAll('.item-row')];
  return rows.map(r=>{
    const desc=r.querySelector('.rowDesc').value.trim();
    const match=findInventoryByName(desc);
    return {
      desc, qty:Number(r.querySelector('.rowQty').value)||0,
      price:Number(r.querySelector('.rowPrice').value)||0,
      discountPct:Number(r.querySelector('.rowDiscount').value)||0,
      invId: match?match.id:null
    };
  }).filter(r=>r.desc || r.qty || r.price);
}
function onItemDescChange(idx,val){
  const match=findInventoryByName(val);
  if(match){
    const rows=[...document.querySelectorAll('.item-row')];
    const r=rows[idx];
    if(r){ r.querySelector('.rowPrice').value = match.sellPrice; }
  }
  liveTotals();
}
let currentDraftItems=null;
function addItemRow(){
  currentDraftItems = readItemsFromDOM();
  currentDraftItems.push({desc:'',qty:1,price:0,discountPct:0,invId:null});
  document.getElementById('itemsWrap').innerHTML = renderItemRows(currentDraftItems);
  liveTotals();
}
function removeItemRow(idx){
  currentDraftItems = readItemsFromDOM();
  currentDraftItems.splice(idx,1);
  if(currentDraftItems.length===0) currentDraftItems.push({desc:'',qty:1,price:0,discountPct:0,invId:null});
  document.getElementById('itemsWrap').innerHTML = renderItemRows(currentDraftItems);
  liveTotals();
}
function liveTotals(){
  const box=document.getElementById('totalsBox');
  if(!box) return;
  const items=readItemsFromDOM();
  const vatOn=document.getElementById('f_vat')?.checked;
  const discountPct=Number(document.getElementById('f_disc')?.value)||0;
  const t=calcTotals(items,vatOn,S.settings.vatRate,discountPct);
  box.innerHTML=`
    <div class="line"><span class="muted">Subtotal</span><span class="mono">${fmtMoney(t.subtotal)}</span></div>
    ${t.overallDiscAmt?`<div class="line"><span class="muted">Discount</span><span class="mono">-${fmtMoney(t.overallDiscAmt)}</span></div>`:''}
    ${vatOn?`<div class="line"><span class="muted">VAT (${S.settings.vatRate}%)</span><span class="mono">${fmtMoney(t.vatAmt)}</span></div>`:''}
    <div class="line grand"><span>Total</span><span class="mono">${fmtMoney(t.total)}</span></div>`;
}

function saveDoc(type,id){
  const list = type==='invoice'? S.invoices : S.quotes;
  const customer = document.getElementById('f_customer').value.trim();
  if(!customer){ toast('Please enter a customer name'); return; }
  const items = readItemsFromDOM();
  if(items.length===0){ toast('Add at least one item'); return; }
  const isNew = !id;
  let doc;
  if(isNew){
    doc = { id:uid(), number: nextNumber(type), stockApplied:false };
    list.push(doc);
  } else {
    doc = list.find(d=>d.id===id);
  }
  doc.customer=customer;
  doc.phone=document.getElementById('f_phone').value.trim();
  doc.email=document.getElementById('f_email').value.trim();
  doc.date=document.getElementById('f_date').value||todayISO();
  doc.dueDate=document.getElementById('f_due').value||'';
  doc.status=document.getElementById('f_status').value;
  doc.items=items;
  doc.vatOn=document.getElementById('f_vat').checked;
  doc.vatRate=S.settings.vatRate;
  doc.discountPct=Number(document.getElementById('f_disc').value)||0;
  doc.notes=document.getElementById('f_notes').value;

  // Stock effect: invoices reduce stock once, on first save
  if(type==='invoice' && isNew){
    items.forEach(it=>{ if(it.invId) adjustStock(it.invId, -Number(it.qty||0)); });
    doc.stockApplied=true;
    persist('inventory');
  }

  persist(type==='invoice'?'invoices':'quotes');
  persist('settings');
  logActivity(`${isNew?'Created':'Updated'} ${type} ${doc.number} — ${customer}`);
  toast(`${type[0].toUpperCase()+type.slice(1)} saved`);
  goBack();
}
function deleteDoc(type,id){
  if(!isAdmin()){ toast('Only admins can delete'); return; }
  showConfirm('Delete this document? This cannot be undone.', ()=>{
  const key = type==='invoice'?'invoices':'quotes';
  const list = S[key];
  const item = list.find(d=>d.id===id);
  if(type==='invoice' && item && item.stockApplied){
    item.items.forEach(it=>{ if(it.invId) adjustStock(it.invId, Number(it.qty||0)); });
    persist('inventory');
  }
  if(type==='invoice'){
    const linkedProject = S.projects.find(p=>p.invoiceId===id);
    if(linkedProject){ linkedProject.invoiceId=null; persist('projects'); }
  }
  S[key]=list.filter(d=>d.id!==id);
  persist(key);
  logActivity(`Deleted ${type} ${item?item.number:''} — ${item?item.customer:''}`);
  toast('Deleted');
  goBack();
  });
}

function quickStatus(type,id,val){
  const list = type==='invoice'? S.invoices : S.quotes;
  const d=list.find(x=>x.id===id); d.status=val;
  persist(type==='invoice'?'invoices':'quotes');
  render();
  toast('Status updated');
}
function convertQuote(id){
  const q = S.quotes.find(x=>x.id===id);
  if(!q) return;
  const inv = {...q, id:uid(), number: nextNumber('invoice'), status:'draft', stockApplied:false};
  S.invoices.push(inv);
  q.status='converted';
  // apply stock for the new invoice
  inv.items.forEach(it=>{ if(it.invId) adjustStock(it.invId, -Number(it.qty||0)); });
  inv.stockApplied=true;
  persist('invoices'); persist('quotes'); persist('inventory'); persist('settings');
  toast('Converted to invoice');
  go('invoice-view',{id:inv.id});
}

/* ---------- SHARE MENU (Print / PDF / Email / Link / WhatsApp) ---------- */
function buildShareSummary(kind,id){
  if(kind==='invoice'||kind==='quote'){
    const list = kind==='invoice'?S.invoices:S.quotes;
    const d=list.find(x=>x.id===id); if(!d) return null;
    const t=calcTotals(d.items,d.vatOn,d.vatRate,d.discountPct);
    let text=`${kind==='invoice'?'Invoice':'Quote'} ${d.number}\n${S.settings.companyName}\n\nBill to: ${d.customer}\nDate: ${fmtDate(d.date)}\n\n`;
    t.calced.forEach(it=>{ text+=`${it.desc} — ${it.qty} × ${fmtMoney(it.price)} = ${fmtMoney(it.net)}\n`; });
    text+=`\nSubtotal: ${fmtMoney(t.subtotal)}\n`;
    if(t.overallDiscAmt) text+=`Discount: -${fmtMoney(t.overallDiscAmt)}\n`;
    if(d.vatOn) text+=`VAT (${d.vatRate}%): ${fmtMoney(t.vatAmt)}\n`;
    text+=`Total: ${fmtMoney(t.total)}\n`;
    if(kind==='invoice'){
      const paid=paymentsSum(d);
      if(paid>0) text+=`Paid so far: ${fmtMoney(paid)}\nRemaining: ${fmtMoney(remaining(d))}\n`;
    }
    return {title:`${kind==='invoice'?'Invoice':'Quote'} ${d.number}`, text, number:d.number};
  }
  if(kind==='purchase'){
    const p=S.purchases.find(x=>x.id===id); if(!p) return null;
    const total=p.items.reduce((a,b)=>a+(Number(b.qty)||0)*(Number(b.cost)||0),0);
    let text=`Purchase Order ${p.number}\n${S.settings.companyName}\n\nSupplier: ${p.supplier}\nDate: ${fmtDate(p.date)}\n\n`;
    p.items.forEach(it=>{ text+=`${it.desc} — Qty ${it.qty}\n`; });
    text+=`\nTotal: ${fmtMoney(total)}\n`;
    return {title:`Purchase ${p.number}`, text, number:p.number};
  }
  if(kind==='project'){

let _html2pdfLoading=null;
function ensureHtml2Pdf(){
  if(window.html2pdf) return Promise.resolve();
  if(_html2pdfLoading) return _html2pdfLoading;
  _html2pdfLoading = new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('load failed'));
    document.head.appendChild(s);
  });
  return _html2pdfLoading;
}
function shareMenuPDF(kind,id){
  const pricesEl = document.getElementById('share_purchase_prices');
  const opts = pricesEl ? {showPrices: pricesEl.checked} : undefined;
  closeModal();
  toast('Preparing PDF…');
  ensureHtml2Pdf().then(()=>{
    const html = buildPdfHTML(kind,id,opts);
    const s = buildShareSummary(kind,id);
    if(!html || !s){ toast('Could not generate PDF'); return; }
    // html2pdf.js deep-clones the element passed to .from() and re-parents the clone
    // into its own (correctly hidden/positioned) render container — so any inline
    // position:fixed/absolute set directly on that element gets cloned too and makes
    // the clone escape html2pdf's container, capturing a blank page. Keep the element
    // we hand to html2pdf unpositioned, and hide it via a plain zero-size ancestor instead.
    const hider=document.createElement('div');
    hider.style.cssText='position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;';
    const wrap=document.createElement('div');
    wrap.innerHTML = html;
    hider.appendChild(wrap);
    document.body.appendChild(hider);
    window.html2pdf().set({
      filename:`${s.number}.pdf`, margin:0,
      image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:2,useCORS:true},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
    }).from(wrap).save()
      .then(()=>document.body.removeChild(hider))
      .catch(()=>{ document.body.removeChild(hider); toast('Could not generate PDF'); });
  }).catch(()=>{ toast('Could not load PDF tool — check your connection'); });
}

/* ---------- IMPORT BOQ ITEMS INTO INVENTORY (across all projects) ---------- */
function collectBoqCandidates(){
  const seen=new Map();
  S.projects.forEach(pr=>{
    (pr.boq||[]).forEach(b=>{
      const key=(b.desc||'').trim().toLowerCase();
      if(!key || seen.has(key)) return;
      seen.set(key,{desc:b.desc, unit:b.unit||'', unitPrice:Number(b.unitPrice)||0, unitCost:Number(b.unitCost)||0, fromProject:pr.number});
    });
  });
  return [...seen.values()];
}
function renderInventoryImport(){
  const candidates=collectBoqCandidates().map(c=>({...c, existing: !!findInventoryByName(c.desc)}));
  const newOnes=candidates.filter(c=>!c.existing);

  return `
  ${topbar('Import from BOQs','Pull items used across projects into inventory', true)}

    ${candidates.length===0? emptyState('box','No BOQ items found','Add bill-of-quantities lines to a project first.') : `

        </div>`).join('')}

    ${newOnes.length? `<button class="btn btn-primary btn-block" onclick="saveBoqImport()">${ic('check')} Add selected to inventory</button>` : `<div class="card"><div class="tiny muted">Everything found is already in inventory.</div></div>`}
    ${already.length? `

function saveBoqImport(){
  const candidates=collectBoqCandidates().filter(c=>!findInventoryByName(c.desc));
  const checks=[...document.querySelectorAll('.boqImportCheck')];
  let added=0;
  checks.forEach(chk=>{
    if(!chk.checked) return;
    const c=candidates[Number(chk.dataset.idx)];
    if(!c || findInventoryByName(c.desc)) return; // guard against duplicates if two candidates share a name
    S.inventory.push({
      id:uid(), name:c.desc, sku:'',
      costPrice:c.unitCost, sellPrice:c.unitPrice,
      stock:0, lowStockThreshold:2
    });
    added++;
  });
  if(added===0){ toast('Nothing selected'); return; }
  persist('inventory');
  logActivity(`Imported ${added} item${added>1?'s':''} into inventory from project BOQs`);
  toast(`${added} item${added>1?'s':''} added to inventory`);
  goBack();
}

function importProjectBoqIntoPurchase(){
  const projId=document.getElementById('p_project').value;
  if(!projId){ toast('Select a project first'); return; }
  const proj=S.projects.find(x=>x.id===projId); if(!proj) return;
  const outstanding=(proj.boq||[]).filter(b=>(Number(b.qty)||0) > (Number(b.purchasedQty)||0));
  if(outstanding.length===0){ toast('Nothing outstanding — everything on this BOQ is already purchased'); return; }
  let items=readPurchaseItemsFromDOM();
  items = items.filter(it=>it.desc || it.qty || it.cost); // drop the lone blank starter row
  outstanding.forEach(b=>{
    const remainingQty=(Number(b.qty)||0)-(Number(b.purchasedQty)||0);
    items.push({desc:b.desc, qty:remainingQty, cost:Number(b.unitCost)||0, invId:findInventoryByName(b.desc)?.id||null, boqItemId:b.id});
  });
  if(items.length===0) items.push({desc:'',qty:1,cost:0,invId:null,boqItemId:null});
  document.getElementById('pItemsWrap').innerHTML=renderPurchaseRows(items);
  purchaseLiveTotals();
  toast(`Imported ${outstanding.length} item${outstanding.length>1?'s':''} from BOQ`);
}

  });
  p.stockApplied=true;
  if(p.projectId){
    const proj=S.projects.find(x=>x.id===p.projectId);
    if(proj){
      p.items.forEach(it=>{
        if(!it.boqItemId) return;
        const line=(proj.boq||[]).find(b=>b.id===it.boqItemId);
        if(line) line.purchasedQty = Math.min(Number(line.qty)||0, (Number(line.purchasedQty)||0)+Number(it.qty||0));
      });
      persist('projects');
    }
  }
}
function reversePurchaseStock(p){
  p.items.forEach(it=>{ if(it.invId) adjustStock(it.invId, -Number(it.qty||0)); });
  p.stockApplied=false;
  if(p.projectId){
    const proj=S.projects.find(x=>x.id===p.projectId);
    if(proj){
      p.items.forEach(it=>{
        if(!it.boqItemId) return;
        const line=(proj.boq||[]).find(b=>b.id===it.boqItemId);
        if(line) line.purchasedQty = Math.max(0, (Number(line.purchasedQty)||0)-Number(it.qty||0));
      });
      persist('projects');
    }
  }
}
function savePurchase(id){
  const supplier=document.getElementById('p_supplier').value.trim();
  if(!supplier){ toast('Enter a supplier name'); return; }
  const items=readPurchaseItemsFromDOM();
  if(items.length===0){ toast('Add at least one item'); return; }
  const isNew=!id; let p;
  if(isNew){ p={id:uid(),number:nextNumber('purchase'),stockApplied:false}; S.purchases.push(p); }
  else {
    p=S.purchases.find(x=>x.id===id);
    if(p.stockApplied) reversePurchaseStock(p); // undo old quantities before applying edited ones
  }
  p.supplier=supplier;
  p.date=document.getElementById('p_date').value||todayISO();
  p.status=document.getElementById('p_status').value;
  p.items=items;
  p.notes=document.getElementById('p_notes').value;
  p.projectId=document.getElementById('p_project').value||null;
  if(p.status==='received'){
    applyPurchaseStock(p);
    persist('inventory');
  }
  persist('purchases'); persist('settings');
  logActivity(`${isNew?'Created':'Updated'} purchase ${p.number} — ${supplier}${p.status==='received'?' (received)':''}`);
  toast(p.status==='received' ? 'Purchase saved — stock added to inventory' : 'Purchase saved');
  goBack();
}
function deletePurchase(id){

function generateProjectInvoice(projId){
  if(!isAdmin()){ toast('Only admins can generate invoices'); return; }

  if(p.invoiceId){

    p.invoiceId=null; // the linked invoice no longer exists — allow generating a new one
  }
  if(!p.boq || p.boq.length===0){ toast('Add BOQ lines before generating an invoice'); return; }
  showConfirm('Generate an invoice for the full BOQ value? Advances already received will be carried over as payments.', ()=>{
  const inv = {
    id:uid(), number:nextNumber('invoice'), date:todayISO(), dueDate:'',
    customer:p.customer, phone:p.phone||'', email:p.email||'',
    items: p.boq.map(b=>({desc:b.desc, qty:b.qty, price:b.unitPrice, discountPct:0, invId:null})),
    vatOn:S.settings.vatDefaultOn, vatRate:S.settings.vatRate, discountPct:0,
    status:'sent', notes:`Generated from project ${p.number} — ${p.name}`,
    payments:(p.payments||[]).map(pay=>({...pay,id:uid()})), stockApplied:false
  };
  refreshPaymentStatus(inv);
  S.invoices.push(inv);
  p.invoiceId=inv.id;
  persist('invoices'); persist('projects'); persist('settings');
  logActivity(`Generated invoice ${inv.number} from project ${p.number}`);

function onBoqDescChange(val){

function saveBoqLine(projId, itemId){
  const desc=document.getElementById('boq_desc').value.trim();
  if(!desc){ toast('Enter a description'); return; }
  const p=S.projects.find(x=>x.id===projId); if(!p) return;
  if(!p.boq) p.boq=[];
  let item;
  if(itemId){ item=p.boq.find(i=>i.id===itemId); } else { item={id:uid(), purchasedQty:0, installedQty:0}; p.boq.push(item); }
  item.desc=desc;
  item.unit=document.getElementById('boq_unit').value.trim();
  item.qty=Number(document.getElementById('boq_qty').value)||0;
  item.unitPrice=Number(document.getElementById('boq_price').value)||0;
  if(isAdmin()){
    const costEl=document.getElementById('boq_cost');
    if(costEl) item.unitCost=Number(costEl.value)||0;
  } else if(item.unitCost===undefined){ item.unitCost=0; }
  persist('projects');
  logActivity(`${itemId?'Updated':'Added'} BOQ line "${desc}" on project ${p.number}`);
  closeModal();
  toast(itemId? 'BOQ line updated' : 'BOQ line added');
  render();
}

/* ---------- REPORTS ---------- */
let REPORT_RANGE='month';
function rangeDates(){
  const now=new Date(); let start,end;
  if(REPORT_RANGE==='month'){ start=new Date(now.getFullYear(),now.getMonth(),1); end=new Date(now.getFullYear(),now.getMonth()+1,0); }
  else if(REPORT_RANGE==='lastmonth'){ start=new Date(now.getFullYear(),now.getMonth()-1,1); end=new Date(now.getFullYear(),now.getMonth(),0); }
  else if(REPORT_RANGE==='year'){ start=new Date(now.getFullYear(),0,1); end=new Date(now.getFullYear(),11,31); }
  else { start=new Date(2000,0,1); end=new Date(2100,0,1); }
  return {start:start.toISOString().slice(0,10), end:end.toISOString().slice(0,10)};
}
function inRange(dateStr,start,end){ return dateStr>=start && dateStr<=end; }

function renderReports(){
  const {start,end} = rangeDates();
  const invs = S.invoices.filter(i=>inRange(i.date,start,end));
  const purs = S.purchases.filter(p=>inRange(p.date,start,end));

  let sales=0, vatCollected=0, outstanding=0, discountGiven=0;
  const itemTotals={};
  invs.forEach(i=>{
    const t=calcTotals(i.items,i.vatOn,i.vatRate,i.discountPct);
    sales+=t.total; vatCollected+=t.vatAmt; discountGiven+=t.overallDiscAmt;
    outstanding+=remaining(i);
    t.calced.forEach(it=>{ itemTotals[it.desc]=(itemTotals[it.desc]||0)+it.net; });
  });
  const paid = S.invoices.reduce((a,i)=> a + (i.payments||[]).filter(p=>inRange(p.date,start,end)).reduce((x,p)=>x+(Number(p.amount)||0),0), 0);
  const purchaseTotal = purs.reduce((a,p)=>a+p.items.reduce((x,y)=>x+(Number(y.qty)||0)*(Number(y.cost)||0),0),0);
  const grossMargin = sales - purchaseTotal;
  const topItems = Object.entries(itemTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxTop = topItems.length? topItems[0][1] : 1;
  const lowStock = S.inventory.filter(i=>Number(i.stock)<=Number(i.lowStockThreshold||0));
  const outstandingInvoices = S.invoices.filter(i=>remaining(i)>0);

  return `
  ${topbar('Reports','Business overview', true)}
  <div class="content">
    <div class="chip-row">
      ${[['month','This month'],['lastmonth','Last month'],['year','This year'],['all','All time']].map(([k,l])=>
        `<div class="chip ${REPORT_RANGE===k?'active':''}" onclick="REPORT_RANGE='${k}';render()">${l}</div>`).join('')}
    </div>
    <div style="height:12px"></div>
    <div class="grid2">
      <div class="stat"><div class="num">${fmtMoney(sales)}</div><div class="lbl">Total sales</div></div>
      <div class="stat"><div class="num">${fmtMoney(vatCollected)}</div><div class="lbl">VAT collected</div></div>
      <div class="stat"><div class="num">${fmtMoney(paid)}</div><div class="lbl">Paid</div></div>
      <div class="stat"><div class="num" style="color:${outstanding>0?'var(--amber)':'inherit'}">${fmtMoney(outstanding)}</div><div class="lbl">Outstanding</div></div>
      <div class="stat"><div class="num">${fmtMoney(purchaseTotal)}</div><div class="lbl">Purchases</div></div>
      <div class="stat"><div class="num" style="color:${grossMargin>=0?'var(--green)':'var(--red)'}">${fmtMoney(grossMargin)}</div><div class="lbl">Gross margin</div></div>
    </div>

    <div class="section-title">Top items / services</div>
    <div class="card">
      ${topItems.length===0? `<div class="tiny muted">No sales in this period yet.</div>` :
        topItems.map(([name,val])=>`
          <div class="bar-wrap">
            <div style="width:96px;font-size:12px" class="muted">${esc(name.slice(0,16))}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(val/maxTop)*100)}%"></div></div>
            <div class="mono tiny" style="width:70px;text-align:right">${fmtMoney(val)}</div>
          </div>`).join('')}
    </div>

    <div class="section-title">Outstanding invoices</div>
    ${outstandingInvoices.length===0? `<div class="card"><div class="tiny muted">All caught up — nothing outstanding.</div></div>` :
      `<div class="card" style="padding:6px 14px">
        ${outstandingInvoices.map(i=>{
          return `<div class="row-between" style="padding:8px 0;border-bottom:1px solid var(--line)" onclick="go('invoice-view',{id:'${i.id}'})">
            <div><div class="small" style="font-weight:600">${esc(i.customer)}</div><div class="tiny muted mono">${i.number}${paymentsSum(i)>0?' · partly paid':''}</div></div>
            <div class="mono">${fmtMoney(remaining(i))}</div>
          </div>`;
        }).join('')}
      </div>`}

    <div class="section-title">Low stock</div>
    ${lowStock.length===0? `<div class="card"><div class="tiny muted">Stock levels look healthy.</div></div>` :
      `<div class="card">${lowStock.map(i=>`<div class="row-between" style="padding:5px 0"><div class="small">${esc(i.name)}</div><div class="mono tiny" style="color:var(--red)">${i.stock} left</div></div>`).join('')}</div>`}

    <div class="section-title">Discounts given</div>
    <div class="card"><div class="row-between"><div class="small muted">Total discounted this period</div><div class="mono">${fmtMoney(discountGiven)}</div></div></div>
  </div>`;
}

function fmtLogTime(ts){
  const d=new Date(ts);
  const now=new Date();
  const sameDay = d.toDateString()===now.toDateString();
  return (sameDay? 'Today' : d.toLocaleDateString(undefined,{day:'2-digit',month:'short'})) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}

      staff.map(u=>`<div class="card row-between">
        <div><div class="small" style="font-weight:600">${esc(u.name)}</div><div class="tiny muted">@${esc(u.username)} · ${u.role==='admin'?'Admin':'Staff'}</div></div>
        <button class="btn btn-danger btn-sm" onclick="removeTeamMember('${u.id}')">${ic('trash')}</button>
      </div>`).join('')}

async function addTeamMember(){
  const name=document.getElementById('t_name').value.trim();
  const username=document.getElementById('t_user').value.trim().toLowerCase();
  const pin=document.getElementById('t_pin').value;
  const role=document.getElementById('t_role').value;
  const err=document.getElementById('t_err');
  if(!name||!username||pin.length<4){ err.textContent='Fill in all fields — PIN needs 4+ characters.'; return; }
  if(S.users.some(u=>u.username===username)){ err.textContent='That username is already taken.'; return; }
  const passHash=await sha256(username+':'+pin);
  S.users.push({id:uid(), name, username, passHash, role});
  await persist('users');
  logActivity(`Added team member "${name}" (${role})`);
  toast('Team member added');
  render();
}
function removeTeamMember(id){
  showConfirm('Remove this team member? They will no longer be able to sign in.', ()=>{
  const u=S.users.find(x=>x.id===id);
  S.users=S.users.filter(u=>u.id!==id);
  persist('users');
  logActivity(`Removed team member "${u?u.name:''}"`);
  toast('Removed');
  render();
  });
}

function saveSettings(){
  if(!isAdmin()){ toast('Only admins can change settings'); return; }
  const s=S.settings;
  s.companyName=document.getElementById('s_name').value.trim()||'The H IT Solutions';
  s.companyPhone=document.getElementById('s_phone').value.trim();
  s.companyEmail=document.getElementById('s_email').value.trim();
  s.companyAddress=document.getElementById('s_addr').value.trim();
  s.companyTRN=document.getElementById('s_trn').value.trim();
  s.currency=document.getElementById('s_cur').value.trim()||'AED';
  s.vatRate=Number(document.getElementById('s_vat').value)||0;
  s.vatDefaultOn=document.getElementById('s_vatdef').checked;
  s.invoicePrefix=document.getElementById('s_pinv').value.trim()||'INV';
  s.quotePrefix=document.getElementById('s_pquo').value.trim()||'QT';

/* ---------- AFTER RENDER HOOKS ---------- */
function afterRender(){
  if(['invoice-form','quote-form'].includes(VIEW.name)) liveTotals();
  if(VIEW.name==='purchase-form') purchaseLiveTotals();
}

loadAll();
window.addEventListener('focus', ()=>{ syncPull(); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncPull(); });
// Select existing value when a number field is focused (click, tab, or tap) so typing
// replaces "0" instead of appending to it — applies to every number input, including
// ones rendered later, since this listens in the capture phase at the document level.
document.addEventListener('focus', (e)=>{
  if(e.target && e.target.tagName==='INPUT' && e.target.type==='number'){
    e.target.select();
  }
}, true);
</script>
